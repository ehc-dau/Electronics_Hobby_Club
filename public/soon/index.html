<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Electronics Hobby Club, DAU</title>
<link rel="icon" href="/brand/logo-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;1,700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f3;--surface:#fff;--ink:#000;--ink-2:#3d4440;--line:#d5dbd7;--brand:#14663b;--on-brand:#fff;--dot:rgba(0,0,0,.10);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c100e;--surface:#151a17;--ink:#f1f4f2;--ink-2:#c3cbc6;--line:#2b332e;--brand:#33a564;--on-brand:#04100a;--dot:rgba(255,255,255,.07);color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.7px);background-size:22px 22px;color:var(--ink);font:400 16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ink);padding:40px 32px 32px;text-align:center}
img{display:block;width:min(360px,100%);height:auto;margin:0 auto 26px}
.dark{display:none}
@media (prefers-color-scheme:dark){.light{display:none}.dark{display:block}}
h1{margin:0 0 10px;font:italic 700 clamp(28px,6vw,38px)/1.05 "Chakra Petch","Arial Narrow",sans-serif;text-transform:uppercase}
h1::after{content:"";display:inline-block;width:.6em;height:.24em;margin-left:.2em;background:var(--brand);transform:skewX(-24deg)}
p{margin:0 auto 22px;max-width:40ch;color:var(--ink-2)}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;background:var(--brand);color:var(--on-brand);font:600 15.5px/1 "Chakra Petch","Arial Narrow",sans-serif;text-decoration:none;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
a.btn:hover{filter:brightness(1.08)}
.fine{margin:22px 0 0;font-size:14px}
.fine a{color:var(--brand)}
</style>
</head>
<body>
<main>
  <img class="light" src="/brand/logo-light.png" alt="EHC, Electronics Hobby Club">
  <img class="dark" src="/brand/logo-dark.png" alt="EHC, Electronics Hobby Club">
  <h1>New site coming soon</h1>
  <p>We’re rebuilding the club website. Borrowing parts, asking the core team for help, and event check-in all work as usual.</p>
  <a class="btn" href="/inventory/">Go to inventory and events</a>
  <p class="fine">Questions? Write to <a href="mailto:ehc@dau.ac.in">ehc@dau.ac.in</a></p>
</main>
</body>
</html>
