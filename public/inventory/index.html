<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EHC Inventory — Electronics Hobby Club, DAU</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpath d='M10 44h16l-3 10H7z' fill='%2314663b'/%3E%3Cpath d='M38 44h16l-3 10H35z' fill='%2314663b'/%3E%3Cpath d='M14 10h40l-3 10H24l-2 6h24l-3 10H19l-4 8H8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f3; --surface:#ffffff; --surface-2:#e9edea; --ink:#000000; --ink-2:#3d4440; --muted:#68716c; --line:#d5dbd7;
  --brand:#14663b; --brand-hover:#0e532f; --brand-tint:#e1eee5; --on-brand:#ffffff;
  --solid:#000000; --on-solid:#ffffff;
  --warn:#875800; --warn-tint:#faeed3; --bad:#ae2419; --bad-tint:#fbe5e2; --info:#1f4e99; --info-tint:#e2eaf7;
  --dot:rgba(0,0,0,.10);
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c100e; --surface:#151a17; --surface-2:#202823; --ink:#f1f4f2; --ink-2:#c3cbc6; --muted:#8d9791; --line:#2b332e;
    --brand:#33a564; --brand-hover:#3fba72; --brand-tint:#16291e; --on-brand:#04100a;
    --solid:#f1f4f2; --on-solid:#000000;
    --warn:#e3a944; --warn-tint:#2b2210; --bad:#f07a70; --bad-tint:#2e1714; --info:#82a8f0; --info-tint:#141e31;
    --dot:rgba(255,255,255,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c100e; --surface:#151a17; --surface-2:#202823; --ink:#f1f4f2; --ink-2:#c3cbc6; --muted:#8d9791; --line:#2b332e;
  --brand:#33a564; --brand-hover:#3fba72; --brand-tint:#16291e; --on-brand:#04100a;
  --solid:#f1f4f2; --on-solid:#000000;
  --warn:#e3a944; --warn-tint:#2b2210; --bad:#f07a70; --bad-tint:#2e1714; --info:#82a8f0; --info-tint:#141e31;
  --dot:rgba(255,255,255,.07);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
img{max-width:100%}
button{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* preview strip */
.demobar{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;justify-content:space-between;padding:8px 20px;background:var(--brand);color:var(--on-brand);font-size:13.5px}
.demobar-actions{display:flex;gap:16px}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.demobar .link{color:inherit}

/* header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:2px solid var(--ink)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:10px 20px 0;display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:6px 28px}
.brand{display:flex;align-items:center;padding-bottom:10px;text-decoration:none;cursor:pointer}
.brand .logo{height:46px;width:auto}
.tabs{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;background:none;border:0;padding:10px 12px 14px;font:600 15px/1 var(--display);color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover,.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-2px;height:5px;background:var(--brand);transform:skewX(-24deg)}
.tab-group{display:flex;align-items:flex-end;gap:2px;margin-left:12px;padding-left:12px;border-left:1px solid var(--line)}
.tab-group-label{font-size:12px;color:var(--muted);padding:0 4px 15px;white-space:nowrap}
.count{min-width:20px;height:20px;padding:0 6px;background:var(--surface-2);color:var(--ink-2);font:600 12px/20px var(--body);text-align:center}
.count.hot{background:var(--brand);color:var(--on-brand)}
.me{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.avatar{width:32px;height:32px;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--surface);font:700 13px/1 var(--display);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.me-text{display:grid;line-height:1.25;font-size:13px;max-width:220px}
.me-text span,.me-text small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-text small{color:var(--muted)}
@media (max-width:1320px){.me-text{display:none}}
@media (max-width:900px){
  .topbar-inner{grid-template-columns:1fr auto}
  .tabs{grid-column:1/-1;grid-row:2;margin:0 -20px;padding:0 10px}
  .me-text{display:none}
  .brand .logo{height:38px}
}

/* layout */
.main{max-width:1180px;margin:0 auto;padding:30px 20px 72px}
body.has-cart .main{padding-bottom:130px}
.view.narrow{max-width:820px}
.view-head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.title{margin:0;font:italic 700 clamp(30px,4.2vw,42px)/1 var(--display);letter-spacing:-.005em;text-transform:uppercase}
.title::after{content:"";display:inline-block;width:.6em;height:.24em;margin-left:.2em;background:var(--brand);transform:skewX(-24deg)}
.sub{margin:10px 0 0;color:var(--ink-2);max-width:62ch}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}

/* buttons */
.btn{--b:var(--solid);--f:var(--on-solid);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:0;background:var(--b);color:var(--f);font:600 14px/1 var(--display);text-decoration:none;cursor:pointer;white-space:nowrap;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn:hover{opacity:.86}
.btn.primary{--b:var(--brand);--f:var(--on-brand)}
.btn.primary:hover{--b:var(--brand-hover);opacity:1}
.btn.danger{--b:var(--bad);--f:var(--surface)}
.btn.ghost{background:transparent;color:var(--ink);clip-path:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink);opacity:1}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.google{background:var(--surface);color:var(--ink);clip-path:none;box-shadow:inset 0 0 0 1.5px var(--ink);min-height:50px;padding:0 24px;font-size:15.5px;gap:12px}
.btn.google:hover{background:var(--surface-2);opacity:1}

/* forms */
.field{display:grid;gap:6px;margin-bottom:16px}
.field>label,.label{font:600 14.5px/1.2 var(--display);color:var(--ink)}
.field small{color:var(--muted);font-size:12.5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:0;padding:9px 12px;min-height:42px}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--brand-tint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.field.short{max-width:240px}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:6px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}

/* inventory */
.toolbar{display:flex;gap:10px;margin-bottom:12px}
.search{position:relative;flex:1;max-width:480px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:38px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.alarm:not(.on){border-color:var(--bad);color:var(--bad)}
.chip-n{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.part{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);padding:14px 16px 16px}
.part.zero{border-top-color:var(--line)}
.part-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.part-name{margin:0;font:600 17.5px/1.25 var(--display)}
.part-notes{margin:-4px 0 0;font-size:13.5px;color:var(--ink-2)}
.loc{margin:-4px 0 0;font-size:13px;color:var(--muted)}
.part-actions{margin-top:auto;padding-top:2px;display:flex;align-items:center;gap:10px;min-height:34px}
.oos{font-size:13.5px;color:var(--muted)}
.kind{font-size:12px;padding:1px 7px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.kind.cons{border-color:transparent;background:var(--warn-tint);color:var(--warn)}
.gauge{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.segs{display:flex;gap:3px;padding-left:3px}
.segs i{width:9px;height:16px;background:var(--surface-2);transform:skewX(-20deg)}
.segs i.on{background:var(--brand)}
.gauge.low .segs i.on{background:var(--warn)}
.gauge-num{font-size:13px;color:var(--ink-2);white-space:nowrap}
.gauge-num b{font:700 18px/1 var(--display);color:var(--ink)}
.gauge.zero .gauge-num b{color:var(--bad)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--ink);background:var(--surface)}
.stepper button{width:34px;height:31px;border:0;background:none;cursor:pointer;font-size:18px;line-height:1}
.stepper button:hover:not(:disabled){background:var(--surface-2)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper span{min-width:30px;text-align:center;font-weight:600}
.in-req{font-size:13px;color:var(--brand);font-weight:600}

/* request bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);color:var(--surface);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.cartbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}

/* new request */
.seg{display:inline-flex;border:1.5px solid var(--ink);margin-bottom:10px;background:var(--surface)}
.seg button{border:0;background:none;padding:10px 18px;font:600 14.5px/1 var(--display);cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--surface)}
.hint{color:var(--ink-2);margin:6px 0 22px;max-width:60ch}
.cart{border:1px solid var(--line);background:var(--surface);margin-bottom:22px}
.cart-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 8px 10px 14px;border-bottom:1px solid var(--line)}
.cart-name{font-weight:600}
.cart-row small{color:var(--muted)}
.cart-row.short small{color:var(--bad);font-weight:600}
.cart-foot{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--surface-2);font-size:14px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:22px;width:34px;height:34px;line-height:1}
.x:hover{color:var(--bad)}
.empty-inline{padding:18px;border:1.5px dashed var(--line);margin-bottom:22px;color:var(--ink-2);background:var(--surface)}

/* requests */
.stack{display:grid;gap:12px}
.req{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);padding:14px 18px 16px}
.req.pending{border-left-color:var(--warn)}
.req.approved{border-left-color:var(--info)}
.req.issued{border-left-color:var(--brand)}
.req.overdue{border-left-color:var(--bad)}
.req-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;font:600 12.5px/1.5 var(--body);background:var(--surface-2);color:var(--ink-2)}
.pill.pending{background:var(--warn-tint);color:var(--warn)}
.pill.approved{background:var(--info-tint);color:var(--info)}
.pill.issued{background:var(--brand-tint);color:var(--brand)}
.pill.overdue{background:var(--bad);color:var(--surface)}
.pill.rejected{background:var(--bad-tint);color:var(--bad)}
.req-title{margin:8px 0 2px;font:600 18.5px/1.3 var(--display)}
.req-who{margin:0 0 4px;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.req-msg{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:72ch}
.req-items{list-style:none;margin:10px 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.req-items li{background:var(--surface-2);padding:4px 10px;font-size:13.5px}
.req-items b{margin-right:3px}
.req-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--ink-2)}
.req-meta .over{color:var(--bad);font-weight:600}
.note{margin-top:10px;padding:8px 12px;background:var(--brand-tint);font-size:14px;overflow-wrap:anywhere}
.note.warn{background:var(--warn-tint)}
.req-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* tags, locations, photos */
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tagchip{border:0;background:var(--brand-tint);color:var(--brand);font:500 12.5px/1.7 var(--body);padding:0 8px;cursor:pointer;white-space:nowrap}
button.tagchip:hover,.tagchip.on{background:var(--brand);color:var(--on-brand)}
span.tagchip{cursor:default}
.tbl .tags{margin-top:5px}
.filter-on{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);flex-wrap:wrap}
.loclink{display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer;text-align:left}
.loclink:hover{color:var(--brand)}
.loclink .cam{flex:none;color:var(--brand)}
.where{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
.locgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.locard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink)}
.lophoto{position:relative;display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;background:var(--surface-2);cursor:pointer;overflow:hidden}
.lophoto img{display:block;width:100%;height:100%;object-fit:cover}
.lophoto.empty{display:grid;place-items:center;color:var(--ink-2);font:600 14.5px/1 var(--display);background-image:repeating-linear-gradient(-24deg,transparent 0 12px,var(--line) 12px 13px)}
.lophoto.empty span{background:var(--surface);padding:9px 14px;border:1.5px solid var(--ink)}
.lophoto.empty:hover span{background:var(--ink);color:var(--surface)}
.lophoto input,.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.lophoto:focus-within,.filebtn:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.filebtn{position:relative}
.lobody{flex:1;display:grid;align-content:start;gap:6px;padding:12px 14px 14px}
.lobody h3{margin:0;font:600 17.5px/1.25 var(--display)}
.lobody p{margin:0;font-size:13.5px;color:var(--ink-2)}
.lobody p.muted{color:var(--muted)}
.lo-actions{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
#lightbox{width:min(940px,calc(100vw - 24px))}
.lightbox-img{display:block;width:100%;height:auto;max-height:68dvh;object-fit:contain;background:var(--surface-2)}
.lb-note{margin:12px 0 0!important}
.lb-head{margin:16px 0 0}
.lb-parts{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.lb-parts li{background:var(--surface-2);padding:3px 9px;font-size:13.5px}
.view .warnline{margin:0 0 18px;font-size:14px}
.me-btn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit}
.me-btn:hover .me-text span{text-decoration:underline;text-underline-offset:3px}
.signin-card.setup-card{text-align:left}
.setup-card .logo-hero{width:min(240px,100%);margin:0 0 20px}
.setup-title{margin:0 0 8px;font:italic 700 30px/1.05 var(--display);text-transform:uppercase}
.setup-card .lede{margin:0 0 22px;font-size:15.5px}
.setup-card .alert{margin:0 0 14px}

/* stock table */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line)}
.tbl{width:100%;min-width:780px;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:600 13.5px/1.2 var(--display);color:var(--ink-2);padding:11px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}
.tbl .out{color:var(--warn);font-weight:600}
.tbl .zero{color:var(--bad);font-weight:600}
.tbl td small{display:block;color:var(--muted)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.tbl-name{font-weight:600}

/* admins */
.inline-form{display:flex;gap:8px;margin-bottom:20px;max-width:540px}
.inline-form input{flex:1}
.people{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line)}
.people li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.people li:last-child{border-bottom:0}
.people .grow{flex:1;min-width:0}
.people .em{font-weight:600;overflow-wrap:anywhere}
.people small{color:var(--muted)}
.tag{font-size:12px;padding:1px 7px;background:var(--brand-tint);color:var(--brand);margin-left:6px;font-weight:600}

/* empty + splash */
.empty{padding:44px 24px;text-align:center;border:1.5px dashed var(--line);background:var(--surface)}
.empty-title{font:600 19px/1.3 var(--display);margin:0 0 6px}
.empty p{margin:0 auto;max-width:48ch;color:var(--ink-2)}
.splash{min-height:60vh;display:grid;place-items:center;color:var(--muted)}

/* dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(540px,calc(100vw - 24px));max-height:calc(100dvh - 32px);overflow:auto;border-top:5px solid var(--brand);box-shadow:0 30px 70px -24px rgba(0,0,0,.55)}
dialog.wide{width:min(720px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(3,7,5,.58)}
.dlg header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 4px}
.dlg h2{margin:0;font:italic 700 23px/1.1 var(--display);text-transform:uppercase}
.dlg-body{padding:10px 20px 2px}
.dlg-body p{margin:0 0 14px;color:var(--ink-2)}
.dlg-body code{font-size:13px;background:var(--surface-2);padding:1px 5px}
.dlg-body textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.dlg-err{margin:0 20px 8px;padding:9px 12px;background:var(--bad-tint);color:var(--bad);font-size:14px}
.dlg footer{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 20px 20px}
.warnline{padding:9px 12px;background:var(--warn-tint);color:var(--warn)!important}
.check{list-style:none;padding:0;margin:0 0 16px;border:1px solid var(--line)}
.check li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.check li:last-child{border-bottom:0}
.check .avail{color:var(--muted);white-space:nowrap;text-align:right}
.check li.bad .avail{color:var(--bad);font-weight:600}
.ret-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ret-in{display:flex;align-items:center;gap:8px;white-space:nowrap}
.ret-in input{width:84px;min-height:36px}

/* toasts */
.toasts{position:fixed;right:0;bottom:0;z-index:60;display:grid;gap:8px;justify-items:end;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none;max-width:440px}
body.has-cart .toasts{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.toast{pointer-events:auto;background:var(--ink);color:var(--surface);padding:11px 14px;font-size:14px;border-left:5px solid var(--brand);box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.toast.err{border-left-color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.toast{animation:toast-in .18s ease-out}}
@keyframes toast-in{from{transform:translateY(8px);opacity:0}}

/* sign in */
.signin{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;place-items:center;padding:40px 20px;background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.7px);background-size:22px 22px}
.signin-card{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ink);padding:38px 32px 30px;text-align:center}
.logo-hero{display:block;width:min(390px,100%);height:auto;margin:0 auto 22px}
.lede{font-size:16.5px;color:var(--ink-2);margin:0 auto 26px;max-width:38ch}
.signin-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.fine{font-size:13.5px;color:var(--muted);margin:18px 0 0}
.alert{margin:16px 0 0;padding:10px 12px;background:var(--bad-tint);color:var(--bad);font-size:14px;text-align:left}


/* ---------- assistant ---------- */
.chat-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;display:inline-flex;align-items:center;gap:9px;min-height:50px;padding:0 20px 0 16px;border:0;background:var(--ink);color:var(--surface);font:600 15px/1 var(--display);cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.chat-fab:hover{background:var(--brand);color:var(--on-brand)}
.chat-fab[hidden]{display:none}
body.has-cart .chat-fab{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.chat{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;width:min(420px,calc(100vw - 40px));height:min(660px,calc(100dvh - 110px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--brand);box-shadow:0 30px 70px -24px rgba(0,0,0,.55)}
.chat[hidden]{display:none}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 8px 10px 16px;border-bottom:1px solid var(--line)}
.chat-head b{display:block;font:italic 700 20px/1.1 var(--display);text-transform:uppercase}
.chat-head small{color:var(--muted);font-size:12.5px}
.chat-log{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{max-width:88%;padding:9px 12px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--surface)}
.msg.assistant{align-self:flex-start;background:var(--surface-2)}
.msg.note{align-self:stretch;max-width:100%;background:var(--warn-tint);color:var(--warn);font-size:13px}
.status-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;white-space:normal}
.status-list li{font-size:13.5px}
.typing{align-self:flex-start;margin:0;color:var(--muted);font-size:13.5px}
.suggest{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.suggest button{border:1.5px solid var(--line);background:var(--surface);padding:7px 11px;font-size:13.5px;cursor:pointer;color:var(--ink-2);text-align:left}
.suggest button:hover{border-color:var(--ink);color:var(--ink)}
.ccard{display:grid;gap:10px;padding:12px;background:var(--surface);border:1.5px solid var(--ink)}
.ccard-h{margin:0;font:600 15.5px/1.2 var(--display)}
.ccard-sub{margin:0;font-size:13.5px;color:var(--ink-2)}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:4px 0 8px;border-bottom:1px solid var(--line)}
.crow .cname{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.crow small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.crow.short small,.crow.miss small{color:var(--bad);font-weight:600}
.crow.pick{grid-template-columns:1fr auto}
.crow.pick .tags{grid-column:1/-1}
.crow.miss{grid-template-columns:1fr auto}
.ccard .field{margin-bottom:0;gap:4px}
.ccard .field>label{font-size:13px}
.ccard input,.ccard textarea{min-height:38px;padding:7px 10px}
.ccard-err{margin:0;padding:7px 10px;background:var(--bad-tint);color:var(--bad);font-size:13.5px}
.ccard-actions{display:flex;flex-wrap:wrap;gap:6px}
.chat-form{display:flex;align-items:flex-end;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-form textarea{flex:1;resize:none;min-height:44px;max-height:120px;line-height:1.4}
.chat-form .btn{min-height:44px}
.who-line{margin:0 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.who-line .label{font:600 14px/1.2 var(--display)}
.sheet{display:grid;gap:6px}
.sheet-item{display:grid;gap:2px;text-align:left;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.sheet-item b{font:600 16px/1.2 var(--display)}
.sheet-item small{color:var(--muted);font-size:13px}
.sheet-item.on{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--brand)}
.bottomnav{display:none}

/* ---------- phones ---------- */
@media (max-width:720px){
  body{font-size:15.5px}
  input,select,textarea{font-size:16px} /* below 16px iOS zooms the page on focus */
  .topbar-inner{grid-template-columns:1fr auto;padding:8px 14px 0;gap:6px 12px}
  .tabs{display:none}
  .brand{padding-bottom:8px}
  .brand .logo{height:34px}
  .me{padding-bottom:8px}
  .me>.btn{display:none}
  .main{padding:20px 14px calc(92px + env(safe-area-inset-bottom,0px))}
  body.has-cart .main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .title{font-size:31px}
  .view-head{margin-bottom:16px}
  .head-actions{width:100%}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 18px;padding:0 14px 2px;scrollbar-width:none}
  .chips.scroll::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap}
  .grid{grid-template-columns:1fr;gap:10px}
  .part{padding:12px 14px 14px}
  .search{max-width:none}
  .seg{display:flex}
  .seg button{flex:1;padding:11px 8px}
  .field.short{max-width:none}
  .form-actions .btn{flex:1}
  .inline-form{flex-direction:column}
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bn{position:relative;display:grid;justify-items:center;align-content:center;gap:4px;min-height:58px;padding:6px 2px;border:0;background:none;color:var(--muted);font:600 11.5px/1 var(--display);cursor:pointer}
  .bn.on{color:var(--ink)}
  .bn.on::before{content:"";position:absolute;top:-2px;left:24%;right:24%;height:4px;background:var(--brand);transform:skewX(-24deg)}
  .bn-n{position:absolute;top:5px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;background:var(--brand);color:var(--on-brand);font:600 11px/18px var(--body);font-style:normal;text-align:center}
  .cartbar{bottom:calc(58px + env(safe-area-inset-bottom,0px));padding:10px 14px}
  .chat-fab{display:none}
  .chat{inset:0;width:100%;height:auto;border:0;border-top:5px solid var(--brand);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:55;box-shadow:none}
  body.chat-open{overflow:hidden}
  .toasts{left:0;max-width:none;justify-items:stretch;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  body.has-cart .toasts{padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}
  dialog,dialog.wide,#lightbox{width:100%;max-width:100%;margin:auto 0 0;max-height:92dvh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .dlg footer .btn{flex:1}
  .locgrid{grid-template-columns:1fr}
  /* stock table turns into one card per part */
  .table-wrap{border:0;background:none;overflow:visible}
  .tbl{min-width:0}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);margin-bottom:10px;padding:10px 12px 12px}
  .tbl td{border:0!important;padding:2px 0;text-align:left}
  .tbl td.cat-cell{color:var(--muted);font-size:13px}
  .tbl td[data-label]{display:inline-block;width:auto;margin-right:14px}
  .tbl td[data-label]::before{content:attr(data-label) "  ";color:var(--muted);font-weight:400}
  .tbl .row-actions{justify-content:flex-start;margin-top:8px}
  .tbl.att{min-width:0}
}
/* fingers need bigger targets than mouse pointers */
@media (pointer:coarse){
  .btn.sm{min-height:40px}
  .stepper button{width:40px;height:38px}
  .x{width:40px;height:40px}
  .tagchip{line-height:2.1}
  .chip{padding:8px 13px}
}


/* ---------- request review, remarks ---------- */
.note.internal{background:var(--surface-2);border-left:3px solid var(--ink)}
.note.quiet{background:var(--surface-2);color:var(--ink-2)}
.items-label{margin:10px 0 -4px;font:600 13px/1.2 var(--display);color:var(--muted)}
.req-items.asked li{background:transparent;border:1px dashed var(--line);color:var(--ink-2)}
.pill.reviewing{background:var(--info-tint);color:var(--info)}
.req.reviewing{border-left-color:var(--info)}
.allot{border:1px solid var(--line);margin:0 0 16px}
.al-row{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.al-row.off .al-name{color:var(--muted);text-decoration:line-through}
.al-row.over .al-qty{border-color:var(--bad);color:var(--bad)}
.al-row.gone{grid-template-columns:1fr;color:var(--muted)}
.al-pick{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.al-pick input{width:20px;height:20px;min-height:0;margin:2px 0 0;accent-color:var(--brand);flex:none}
.al-name{font-weight:600;font-size:14.5px}
.al-name small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.al-qty{min-height:38px;text-align:center}
.al-add{padding:8px 10px;border-bottom:1px solid var(--line)}
.al-add select{min-height:38px}
.al-sum{margin:0!important;padding:8px 10px;font-size:13.5px;background:var(--surface-2)}
.private-box{border:1.5px dashed var(--line);padding:12px 12px 0;margin:4px 0 16px}
.private-h{margin:0 0 10px!important;font:600 13px/1.2 var(--display);color:var(--ink)!important}
.tbl small.remark{color:var(--ink-2);border-left:2px solid var(--line);padding-left:6px;margin-top:3px}
.check-line{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:4px 0 12px;cursor:pointer}
.check-line input{width:18px;height:18px;min-height:0;margin:2px 0 0;accent-color:var(--brand);flex:none}
.alert.ok{background:var(--brand-tint);color:var(--brand)}
.subnav{display:inline-flex;border:1.5px solid var(--ink);margin:0 0 18px;background:var(--surface)}
.subnav button{border:0;background:none;padding:8px 16px;font:600 14px/1 var(--display);cursor:pointer}
.subnav button+button{border-left:1.5px solid var(--ink)}
.subnav button.on{background:var(--ink);color:var(--surface)}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0 12px}
@media (max-width:560px){.row3{grid-template-columns:1fr 1fr}.row3 .field:first-child{grid-column:1/-1}}

/* ---------- events ---------- */
.section-h{margin:28px 0 12px;font:italic 700 20px/1.1 var(--display);text-transform:uppercase}
.ev{display:grid;grid-template-columns:62px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);padding:14px 16px}
.ev.clickable{cursor:pointer}
.ev.clickable:hover,.ev.clickable:focus-visible{border-top-color:var(--brand)}
.ev-date{display:grid;justify-items:center;align-content:start;background:var(--ink);color:var(--surface);padding:8px 0 7px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.ev-date b{font:italic 700 26px/1 var(--display)}
.ev-date span{font:600 12px/1.3 var(--display);text-transform:uppercase;color:var(--brand)}
:root:not([data-theme="light"]) .ev-date span{color:var(--brand)}
.ev-body h3{margin:0;font:600 18px/1.25 var(--display)}
.ev-meta{margin:3px 0 0;font-size:14px;color:var(--ink-2)}
.ev-desc{margin:8px 0 0;font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag.off{background:var(--surface-2);color:var(--ink-2)}
.tag.live{background:var(--brand);color:var(--on-brand)}
.ev-ok{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-weight:600;color:var(--brand)}
.ev-open{margin:10px 0 8px;font-size:14px}
.ev-code-row{display:flex;gap:8px;max-width:320px}
.ev-code-row input{text-transform:uppercase;letter-spacing:.2em;font-weight:600;text-align:center}
.back{display:inline-block;margin-bottom:14px}
.back::before{content:"← "}
.att-count{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:10px}
.att-count b{font:italic 700 30px/1 var(--display)}
@media (min-width:721px){.tbl.att{min-width:640px}}
.m-res{display:grid;gap:6px;margin:-6px 0 14px}
.m-hit{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;color:var(--ink)}
.m-hit:hover{border-color:var(--ink)}
.m-hit span{color:var(--muted)}
.ci-ok{display:flex;align-items:center;gap:14px;padding:14px;background:var(--brand-tint);margin-bottom:12px}
.ci-ok .tick{width:38px;height:38px;color:var(--brand);flex:none}
.ci-ok b{display:block;font:600 18px/1.2 var(--display)}
.ci-ok span{color:var(--ink-2)}
.ci-bad{padding:12px;background:var(--bad-tint);color:var(--bad)!important}

/* the projector screen: always dark, whatever the device theme */
.display{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:#0b0e0c;color:#f1f4f2;padding:calc(18px + env(safe-area-inset-top,0px)) 28px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto}
body.displaying{overflow:hidden}
.disp-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.disp-logo{height:48px;width:auto}
.disp-actions{display:flex;gap:8px;flex-wrap:wrap}
.display .btn{--b:#f1f4f2;--f:#000}
.disp-main{flex:1;display:grid;grid-template-columns:minmax(260px,min(62vh,46vw)) 1fr;gap:5vw;align-items:center;max-width:1300px;width:100%;margin:0 auto}
.disp-qr{background:#fff;padding:16px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.disp-qr .qr{display:block;width:100%;height:auto}
.disp-qr p{color:#000;text-align:center;margin:40% 0}
.disp-bar{height:6px;background:#e7ece9;margin-top:10px;overflow:hidden}
.disp-bar i{display:block;height:100%;background:#14663b;transform-origin:left;transition:transform 1s linear}
.disp-kicker{margin:0;font:600 18px/1 var(--display);color:#33a564;text-transform:uppercase;letter-spacing:.08em}
.disp-info h1{margin:10px 0 18px;font:italic 700 clamp(32px,5vw,68px)/1.02 var(--display);text-transform:uppercase}
.disp-how{font-size:clamp(17px,1.6vw,22px);color:#c3cbc6;max-width:30ch;margin:0 0 28px}
.disp-code-l{margin:0;color:#8d9791;font-size:15px}
.disp-code{margin:4px 0 26px;font:700 clamp(40px,5vw,72px)/1 var(--display);letter-spacing:.14em;color:#fff}
.disp-count{margin:0;font-size:20px;color:#c3cbc6}
.disp-count b{font:italic 700 44px/1 var(--display);color:#33a564;margin-right:6px}
@media (max-width:760px){.disp-main{grid-template-columns:1fr;gap:20px;padding-top:12px}.disp-qr{max-width:420px;margin:0 auto;width:100%}.disp-how{display:none}}


/* ---------- website dashboard ---------- */
.site-status{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding:14px 16px;margin:0 0 20px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn)}
.site-status.live{border-left-color:var(--brand)}
.site-status b{display:block;font:600 17px/1.3 var(--display)}
.site-status span{color:var(--ink-2);font-size:14px}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;margin:0 0 6px}
.row-head p{margin:0}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.pcard{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line)}
.pc-photo{width:56px;height:56px;background:var(--ink);color:var(--surface);display:grid;place-items:center;overflow:hidden;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);font:italic 700 20px/1 var(--display)}
.pc-photo img{width:100%;height:100%;object-fit:cover}
.pc-body{min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.pc-body b{flex-basis:100%;font:600 16px/1.25 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-body small{flex-basis:100%;color:var(--muted)}
.pc-actions{display:flex;gap:4px;align-items:center}
.icon-btn{width:34px;height:34px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;line-height:1}
.icon-btn:hover:not(:disabled){border-color:var(--ink)}
.icon-btn:disabled{opacity:.3;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.ptile{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-top:3px solid var(--ink);background:var(--surface);cursor:pointer;color:var(--ink)}
.ptile:hover{border-top-color:var(--brand)}
.pt-img{aspect-ratio:4/3;background:var(--ink);display:grid;place-items:center;overflow:hidden;color:var(--brand);font:italic 700 40px/1 var(--display)}
.pt-img img{width:100%;height:100%;object-fit:cover}
.pt-body{display:grid;gap:4px;padding:12px 14px 14px}
.pt-body b{font:600 17px/1.25 var(--display)}
.pt-body small{color:var(--ink-2);font-size:13.5px}
.pt-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.gtile{position:relative;padding:0;border:0;aspect-ratio:1;overflow:hidden;cursor:pointer;background:var(--surface-2)}
.gtile img{width:100%;height:100%;object-fit:cover}
.gtile span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12.5px;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.gtile span:empty{display:none}
.gtile.off img{opacity:.4}
.photo-now{display:flex;align-items:center;gap:14px;margin:-4px 0 14px}
.photo-now img{width:72px;height:72px;object-fit:cover}
.photo-now.wide img{width:100%;max-width:360px;height:auto;max-height:240px;object-fit:contain;background:var(--surface-2)}
.upload-note{margin:10px 0 0;padding:9px 12px;background:var(--brand-tint);color:var(--brand);font-weight:600}
.site-form{max-width:760px;margin-top:14px}

const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowISO = () => new Date().toISOString();
const pad2 = n => String(n).padStart(2, '0');
const localDate = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return localDate(d); };
const parseDay = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDay = s => s ? parseDay(s).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const dayDiff = (a, b) => Math.round((parseDay(a) - parseDay(b)) / 86400000);
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const shortId = id => String(id).slice(-5).toUpperCase();
const clampInt = (v, lo, hi) => { const n = Math.floor(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : lo; };
const emailOk = e => /^[^\s@]+@[^\s@]+$/.test(e);
const emailAllowed = e => CONFIG.allowedDomains.some(d => String(e).toLowerCase().endsWith('@' + d));
const domainsText = () => CONFIG.allowedDomains.map(d => '@' + d).join(' or ');
function relTime(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  if (s < 7 * 86400) return plural(Math.floor(s / 86400), 'day') + ' ago';
  return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
}

/* =====================================================================
   Domain rules — shared by the Firebase and preview back ends.
   Every stock change goes through these two functions.
   ===================================================================== */
// <domain>
const TYPE_LABEL = { component: 'Parts', help: 'Help', guidance: 'Guidance' };
const isOverdue = r => r.status === 'issued' && !!r.dueDate && r.dueDate < localDate();

// Tags: split on , ; or |, trim, de-duplicate case-insensitively (first spelling wins), max 12.
function normTags(v) {
  const out = [], seen = new Set();
  for (const raw of Array.isArray(v) ? v : String(v || '').split(/[,;|]/)) {
    const t = String(raw).trim().replace(/\s+/g, ' ').slice(0, 24);
    if (t && !seen.has(t.toLowerCase())) { seen.add(t.toLowerCase()); out.push(t); }
  }
  return out.slice(0, 12);
}
function cleanComponent(d) {
  return {
    name: String(d.name || '').trim(),
    category: String(d.category || '').trim() || 'Misc',
    locationId: String(d.locationId || '').trim(),
    location: String(d.location || '').trim(), // copy of the location name, kept for exports and older records
    kind: d.kind === 'consumable' ? 'consumable' : 'returnable',
    notes: String(d.notes || '').trim(),
    tags: normTags(d.tags),
  };
}
function newComponent(d) {
  const t = clampInt(d.totalQty ?? d.quantity, 0, 100000);
  const at = nowISO();
  const c = { ...cleanComponent(d), totalQty: t, availableQty: t, createdAt: at, updatedAt: at };
  if (!c.name) throw new Error('Name is required.');
  return c;
}
// Editing the total keeps the number currently out (issued or reserved) fixed.
function planComponentEdit(cur, next) {
  const total = Math.floor(Number(next.totalQty));
  if (!Number.isFinite(total) || total < 0) throw new Error('Total quantity must be 0 or more.');
  const out = (cur.totalQty || 0) - (cur.availableQty || 0);
  if (total < out) throw new Error(`${plural(out, 'unit')} ${out === 1 ? 'is' : 'are'} out or reserved, so the total can’t go below ${out}.`);
  const c = cleanComponent(next);
  if (!c.name) throw new Error('Name is required.');
  return { ...c, totalQty: total, availableQty: total - out, updatedAt: nowISO() };
}

/*
  Request lifecycle
    parts:            pending → reviewing (optional) → approved (stock reserved) → issued (due date) → closed (returned)
                      consumable-only requests close straight from "issued"
    help / guidance:  pending → approved ("accepted") → closed
    rejected / cancelled any time before hand-over; reserved stock is released.
  The requester can edit or cancel only while "pending". Once the core team marks it "reviewing",
  or approves it, only the core team can change it.
*/
const OPEN_STATES = ['pending', 'reviewing'];

// An item list, merged by part and checked against the inventory. Names and kinds always come
// from the inventory: request documents are written by requesters, so their copies can't be trusted.
function cleanLines(lines, comps) {
  const merged = new Map();
  for (const it of lines || []) {
    if (!it || !it.componentId) continue;
    const e = merged.get(it.componentId) || { qty: 0, name: it.name };
    e.qty += Number(it.qty);
    merged.set(it.componentId, e);
  }
  return [...merged].map(([id, e]) => {
    const c = comps[id];
    if (!c) throw new Error(`“${e.name || 'A part'}” isn’t in the inventory any more.`);
    if (!Number.isInteger(e.qty) || e.qty < 1 || e.qty > 1000) throw new Error(`Invalid quantity for ${c.name}.`);
    return { componentId: id, name: c.name, qty: e.qty, kind: c.kind === 'consumable' ? 'consumable' : 'returnable' };
  });
}
const lineKey = lines => JSON.stringify((lines || []).map(l => [l.componentId, Number(l.qty)]).sort());
// "3→2 × ESP32; removed Raspberry Pi; added 1 × Arduino Uno"
function describeChange(before, after) {
  const b = new Map((before || []).map(l => [l.componentId, l])), a = new Map((after || []).map(l => [l.componentId, l]));
  const out = [];
  for (const [id, l] of a) { const o = b.get(id); if (!o) out.push(`added ${l.qty} × ${l.name}`); else if (Number(o.qty) !== l.qty) out.push(`${o.qty}→${l.qty} × ${l.name}`); }
  for (const [id, o] of b) if (!a.has(id)) out.push(`removed ${o.name}`);
  return out.join('; ');
}

function planTransition(r, comps, action, extra = {}, actor = '') {
  const at = nowISO();
  const isParts = r.type === 'component';
  const need = (ok, msg) => { if (!ok) throw new Error(msg); };
  const patches = {};
  const cur = (id, k) => (patches[id] && patches[id][k] !== undefined ? patches[id][k] : comps[id][k]);
  const setP = (id, p) => { patches[id] = { ...(patches[id] || {}), ...p }; };
  const reqPatch = {};
  let status, change = '';

  // Moves stock from what is reserved now (before) to what should be reserved (after).
  const reserve = (before, after) => {
    const diff = {};
    for (const l of before) diff[l.componentId] = (diff[l.componentId] || 0) - Number(l.qty);
    for (const l of after) diff[l.componentId] = (diff[l.componentId] || 0) + Number(l.qty);
    for (const [id, d] of Object.entries(diff)) {
      if (!d || !comps[id]) continue; // a deleted part has nothing to give back
      const left = cur(id, 'availableQty');
      if (d > 0) need(left >= d, `Only ${left} × ${comps[id].name} available; this needs ${d} more.`);
      setP(id, { availableQty: Math.min(cur(id, 'totalQty'), left - d) });
    }
  };
  // Records the new item list, keeping the requester's original ask the first time it changes.
  const setItems = lines => {
    if (lineKey(lines) !== lineKey(r.items)) {
      change = describeChange(r.items, lines);
      if (!r.requestedItems) reqPatch.requestedItems = r.items || [];
    }
    reqPatch.items = lines;
  };
  const edited = () => cleanLines(extra.items || r.items, comps);

  switch (action) {
    case 'review': {
      need(r.status === 'pending', 'Only pending requests can be put under review.');
      status = 'reviewing';
      break;
    }
    case 'revise': {
      need(isParts, 'Only parts requests have items to change.');
      need([...OPEN_STATES, 'approved'].includes(r.status), 'This request can’t be changed any more.');
      const lines = edited();
      need(lines.length, 'Keep at least one part, or reject the request.');
      if (r.status === 'approved') reserve(r.items || [], lines);
      setItems(lines);
      status = r.status === 'approved' ? 'approved' : 'reviewing';
      break;
    }
    case 'approve': {
      need(OPEN_STATES.includes(r.status), 'Only pending requests can be approved.');
      if (isParts) {
        const lines = edited();
        need(lines.length, 'Select at least one part, or reject the request.');
        reserve([], lines);
        setItems(lines);
      }
      status = 'approved';
      break;
    }
    case 'reject': {
      need(OPEN_STATES.includes(r.status), 'Only pending requests can be rejected.');
      status = 'rejected';
      break;
    }
    case 'issue': {
      need(isParts && r.status === 'approved', 'Only approved parts requests can be handed over.');
      let lines = r.items || [];
      if (extra.items) {
        lines = cleanLines(extra.items, comps);
        need(lines.length, 'Hand over at least one part, or cancel the request.');
        reserve(r.items || [], lines);
        setItems(lines);
      }
      const returnable = lines.some(i => i.kind !== 'consumable');
      if (returnable) {
        need(/^\d{4}-\d{2}-\d{2}$/.test(extra.dueDate || ''), 'Pick a return date.');
        reqPatch.dueDate = extra.dueDate;
      }
      reqPatch.issuedAt = at;
      status = returnable ? 'issued' : 'closed';
      break;
    }
    case 'return': {
      need(r.status === 'issued', 'Only parts that are out can be marked returned.');
      const lost = [];
      for (const it of r.items || []) {
        if (it.kind === 'consumable') continue;
        const back = clampInt(extra.returned && extra.returned[it.componentId] !== undefined ? extra.returned[it.componentId] : it.qty, 0, it.qty);
        const missing = it.qty - back;
        if (missing) lost.push(`${missing} × ${it.name}`);
        if (!comps[it.componentId]) continue; // part deleted since; nothing to restock
        const total = Math.max(0, cur(it.componentId, 'totalQty') - missing);
        setP(it.componentId, { totalQty: total, availableQty: Math.min(total, cur(it.componentId, 'availableQty') + back) });
      }
      reqPatch.returnedAt = at;
      if (lost.length) reqPatch.lossNote = lost.join(', ');
      status = 'closed';
      break;
    }
    case 'cancel': {
      need([...OPEN_STATES, 'approved'].includes(r.status), 'Only requests that haven’t been handed over can be cancelled.');
      if (isParts && r.status === 'approved') reserve(r.items || [], []);
      status = 'cancelled';
      break;
    }
    case 'close': {
      need(!isParts && r.status === 'approved', 'Only accepted help or guidance requests can be marked resolved.');
      status = 'closed';
      break;
    }
    default:
      throw new Error('Unknown action.');
  }

  const note = String(extra.note || '').trim();
  if (note) reqPatch.adminNote = note;
  reqPatch.status = status;
  reqPatch.updatedAt = at;
  reqPatch.handledBy = actor;
  reqPatch.history = [...(r.history || []), { status, by: actor, at, ...(note ? { note } : {}), ...(change ? { change } : {}) }];
  return { reqPatch, compPatches: patches };
}
// </domain>

// Fields set to SERVER_TIME are stamped by the server (Firebase) or the browser clock (preview).
const SERVER_TIME = '__server_time__';

/* =====================================================================
   Back end 1: Firebase (Google sign-in + Firestore). Used when CONFIG.firebase is filled.
   Security is enforced by firestore.rules, not by this code.
   ===================================================================== */
async function makeFirebaseBackend() {
  const base = `https://www.gstatic.com/firebasejs/${CONFIG.firebaseSdkVersion}`;
  const [appMod, authMod, fs] = await Promise.all([
    import(`${base}/firebase-app.js`),
    import(`${base}/firebase-auth.js`),
    import(`${base}/firebase-firestore.js`),
  ]);
  const app = appMod.initializeApp(CONFIG.firebase);
  const auth = authMod.getAuth(app);
  const db = fs.getFirestore(app);
  const { collection, doc, getDoc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, query, where, orderBy, limit, runTransaction, writeBatch } = fs;
  const col = n => collection(db, n);
  const rows = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const onErr = e => toast(friendly(e), 'err');
  const withTime = data => Object.fromEntries(Object.entries(data).map(([k, v]) => [k, v === SERVER_TIME ? fs.serverTimestamp() : v]));
  const plainDoc = d => { const o = { id: d.id }; for (const [k, v] of Object.entries(d.data())) o[k] = v && typeof v.toDate === 'function' ? v.toDate().toISOString() : v; return o; };

  return {
    demo: false,
    onAuth(cb) {
      authMod.onAuthStateChanged(auth, u => cb(u ? { email: (u.email || '').toLowerCase(), name: u.displayName || '', verified: u.emailVerified } : null));
    },
    async signIn() {
      const p = new authMod.GoogleAuthProvider();
      // "hd" only pre-filters Google’s account picker. The real check is in firestore.rules.
      p.setCustomParameters({ hd: CONFIG.allowedDomains[0], prompt: 'select_account' });
      await authMod.signInWithPopup(auth, p);
    },
    async signOut() { await authMod.signOut(auth); },
    async checkAdmin(email) {
      try { return (await getDoc(doc(db, 'admins', email))).exists(); } catch { return false; }
    },
    watchComponents(cb) { return onSnapshot(col('components'), s => cb(rows(s)), onErr); },
    async saveComponent(data, id) {
      if (!id) return (await addDoc(col('components'), newComponent(data))).id;
      await runTransaction(db, async tx => {
        const ref = doc(db, 'components', id);
        const s = await tx.get(ref);
        if (!s.exists()) throw new Error('That part no longer exists.');
        tx.update(ref, planComponentEdit(s.data(), data));
      });
    },
    async deleteComponent(id) { await deleteDoc(doc(db, 'components', id)); },
    async bulkAddComponents(list) {
      const ids = [];
      for (let i = 0; i < list.length; i += 400) {
        const b = writeBatch(db);
        list.slice(i, i + 400).forEach(r => { const ref = doc(col('components')); ids.push(ref.id); b.set(ref, newComponent(r)); });
        await b.commit();
      }
      return ids;
    },
    watchMyRequests(email, cb) { return onSnapshot(query(col('requests'), where('requesterEmail', '==', email)), s => cb(rows(s)), onErr); },
    watchAllRequests(cb) { return onSnapshot(query(col('requests'), orderBy('createdAt', 'desc'), limit(500)), s => cb(rows(s)), onErr); },
    async createRequest(req) { return (await addDoc(col('requests'), req)).id; },
    async cancelOwnRequest(id) { await updateDoc(doc(db, 'requests', id), { status: 'cancelled', updatedAt: nowISO() }); },
    async updateOwnRequest(id, patch) { await updateDoc(doc(db, 'requests', id), { ...patch, updatedAt: nowISO() }); },
    async idToken() { return auth.currentUser ? auth.currentUser.getIdToken() : ''; },
    async transition(id, action, extra, actor) {
      await runTransaction(db, async tx => {
        const rRef = doc(db, 'requests', id);
        const rs = await tx.get(rRef);
        if (!rs.exists()) throw new Error('That request no longer exists.');
        const r = rs.data();
        const comps = {};
        for (const cid of [...new Set([...(r.items || []), ...((extra && extra.items) || [])].map(i => i.componentId).filter(Boolean))]) {
          const cs = await tx.get(doc(db, 'components', cid));
          if (cs.exists()) comps[cid] = cs.data();
        }
        const { reqPatch, compPatches } = planTransition(r, comps, action, extra, actor);
        for (const [cid, p] of Object.entries(compPatches)) tx.update(doc(db, 'components', cid), { ...p, updatedAt: nowISO() });
        tx.update(rRef, reqPatch);
      });
    },
    watchAdmins(cb) { return onSnapshot(col('admins'), s => cb(s.docs.map(d => ({ email: d.id, ...d.data() }))), onErr); },
    async addAdmin(email, actor) { await setDoc(doc(db, 'admins', email), { addedBy: actor, addedAt: nowISO() }); },
    async removeAdmin(email) { await deleteDoc(doc(db, 'admins', email)); },

    // Generic helpers used by events, attendance, private remarks and site content.
    // Timestamps come back as ISO strings so the rest of the app never sees Firestore types.
    watchPath(path, cb, filter) {
      const ref = collection(db, path);
      return onSnapshot(filter ? query(ref, fs.where(filter[0], filter[1], filter[2])) : ref, s => cb(s.docs.map(plainDoc)), onErr);
    },
    async getPath(path) { const s = await getDoc(doc(db, path)); return s.exists() ? plainDoc(s) : null; },
    async setPath(path, data, merge = false) { await setDoc(doc(db, path), withTime(data), { merge }); },
    async addPath(path, data) { return (await addDoc(collection(db, path), withTime(data))).id; },
    async delPath(path) { await deleteDoc(doc(db, path)); },
    async batchWrite(ops) {
      for (let i = 0; i < ops.length; i += 400) {
        const b = writeBatch(db);
        ops.slice(i, i + 400).forEach(o => (o.op === 'delete' ? b.delete(doc(db, o.path)) : b.set(doc(db, o.path), withTime(o.data), { merge: !!o.merge })));
        await b.commit();
      }
    },

    // people: users/{email} holds the name and phone each person registers once
    async getProfile(email) { const s = await getDoc(doc(db, 'users', email)); return s.exists() ? s.data() : null; },
    async saveProfile(email, p) { await setDoc(doc(db, 'users', email), { name: p.name, phone: p.phone || '', updatedAt: nowISO() }); },
    watchUsers(cb) { return onSnapshot(col('users'), s => cb(Object.fromEntries(s.docs.map(d => [d.id, d.data()]))), onErr); },

    // locations: small thumbnail on the location doc, full photo fetched only when opened
    watchLocations(cb) { return onSnapshot(col('locations'), s => cb(rows(s)), onErr); },
    async saveLocation(d, id) {
      const data = { name: d.name, notes: d.notes || '', updatedAt: nowISO() };
      if (id) { await updateDoc(doc(db, 'locations', id), data); return id; }
      return (await addDoc(col('locations'), { ...data, thumb: '', createdAt: nowISO() })).id;
    },
    async setLocationPhoto(id, full, thumb) {
      const b = writeBatch(db);
      b.set(doc(db, 'locationPhotos', id), { data: full, updatedAt: nowISO() });
      b.update(doc(db, 'locations', id), { thumb, photoAt: nowISO(), updatedAt: nowISO() });
      await b.commit();
    },
    async getLocationPhoto(id) { const s = await getDoc(doc(db, 'locationPhotos', id)); return s.exists() ? s.data().data : ''; },
    async deleteLocation(id, componentIds) {
      for (let i = 0; i < Math.max(componentIds.length, 1); i += 400) {
        const b = writeBatch(db);
        if (i === 0) { b.delete(doc(db, 'locations', id)); b.delete(doc(db, 'locationPhotos', id)); }
        componentIds.slice(i, i + 400).forEach(cid => b.update(doc(db, 'components', cid), { locationId: '', location: '', updatedAt: nowISO() }));
        await b.commit();
      }
    },
  };
}

const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(data) { let c = 0xFFFFFFFF; for (let i = 0; i < data.length; i++) c = CRC_TABLE[(c ^ data[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStored(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const head = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, 0, 2], [12, 0x21, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, name.length, 2], [28, 0, 2]]
      .forEach(([o, v, w]) => (w === 4 ? head.setUint32(o, v, true) : head.setUint16(o, v, true)));
    parts.push(new Uint8Array(head.buffer), name, data);
    const cen = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, 0, 2], [14, 0x21, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, name.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, offset, 4]]
      .forEach(([o, v, w]) => (w === 4 ? cen.setUint32(o, v, true) : cen.setUint16(o, v, true)));
    central.push(new Uint8Array(cen.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const size = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, size, 4], [16, offset, 4]].forEach(([o, v, w]) => (w === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true)));

}
function xlsxBlob(sheetName, rows) {
  const x = v => String(v ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

    const ref = colName(c) + (r + 1), style = r === 0 ? ' s="1"' : '';
    return typeof v === 'number' && Number.isFinite(v) ? `<c r="${ref}"${style}><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"${style}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
  };
  const body = rows.map((row, r) => `<row r="${r + 1}">${row.map((v, c) => cell(v, r, c)).join('')}</row>`).join('');
  const widths = (rows[0] || []).map((_, c) => Math.min(60, Math.max(8, ...rows.map(row => String(row[c] ?? '').length + 2))));
  const safeName = (String(sheetName).replace(/[\[\]:*?/\\]/g, ' ').trim() || 'Sheet1').slice(0, 31);
  const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const NS = 'http://schemas.openxmlformats.org';
  return zipStored([
    { name: '[Content_Types].xml', text: `${XML}<Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
    { name: '_rels/.rels', text: `${XML}<Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', text: `${XML}<workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets><sheet name="${x(safeName)}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', text: `${XML}<Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/styles.xml', text: `${XML}<styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
    { name: 'xl/worksheets/sheet1.xml', text: `${XML}<worksheet xmlns="${NS}/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w, c) => `<col min="${c + 1}" max="${c + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${body}</sheetData></worksheet>` },
  ]);
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function toast(msg, kind = 'ok') {
  const el = document.createElement('div');
  el.className = `toast ${kind === 'err' ? 'err' : ''}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? 6500 : 3500);
}
function friendly(e) {
  const code = (e && e.code) || '';
  if (code.includes('permission-denied')) return 'Permission denied by the database rules. If the site was just updated, the new firestore.rules need deploying too. If you were just made an admin, reload the page.';
  if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return 'The Google sign-in window was closed before finishing.';
  if (code === 'auth/popup-blocked') return 'Your browser blocked the sign-in pop-up. Allow pop-ups for this site and try again.';
  if (code === 'auth/unauthorized-domain') return 'This web address isn’t on the Firebase Auth authorised-domains list yet.';
  if (code === 'unavailable') return 'Can’t reach the server. Check your connection and try again.';
  return (e && e.message) || String(e);
}

  const n = String(name || '').trim();
  if (n && /\p{L}/u.test(n)) return n.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  return String(email || '?').slice(0, 2).toUpperCase();
}

/* ---------- photos: shrink on the phone before upload; Firestore docs cap at 1 MiB ---------- */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Couldn’t read that image. Try a JPEG or PNG photo.')); };
    img.src = url;
  });
}
function toJpeg(img, maxDim, quality) {
  const k = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', quality);
}
async function photoSquare(file, size) {
  const { img, url } = await loadImage(file);
  try {
    const side = Math.min(img.naturalWidth, img.naturalHeight), out = Math.min(size, side);
    const c = document.createElement('canvas');
    c.width = out; c.height = out;
    // Portraits: keep the upper part, where faces usually are, rather than the exact middle.
    const top = img.naturalHeight > img.naturalWidth ? (img.naturalHeight - side) * 0.2 : (img.naturalHeight - side) / 2;
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, top, side, side, 0, 0, out, out);
    return c.toDataURL('image/jpeg', 0.8);
  } finally { URL.revokeObjectURL(url); }
}
async function photoPair(file, { thumb: thumbDim = 420 } = {}) {
  if (!file || !/^image\//.test(file.type || 'image/')) throw new Error('That file isn’t an image.');
  const { img, url } = await loadImage(file);
  try {
    let dim = 1400, q = 0.8, full = toJpeg(img, dim, q);
    while (full.length > 650000 && dim > 500) { dim = Math.round(dim * 0.82); q = Math.max(0.55, q - 0.05); full = toJpeg(img, dim, q); }
    return { full, thumb: toJpeg(img, thumbDim, 0.72) };
  } finally { URL.revokeObjectURL(url); }
}
async function uploadLocationPhoto(id, file) {
  if (!file) return;
  toast('Saving photo…');
  try { const { full, thumb } = await photoPair(file); await B.setLocationPhoto(id, full, thumb); toast('Photo saved.'); }
  catch (e) { toast(friendly(e), 'err'); }
}

function gauge(c) {
  const t = c.totalQty || 0, a = c.availableQty || 0;
  const on = a <= 0 ? 0 : Math.max(1, Math.round((a / t) * 10));
  const lvl = a <= 0 ? 'zero' : a / t <= 0.25 ? 'low' : '';

  return `<div class="gauge ${lvl}" role="img" aria-label="${a} of ${t} available"><span class="segs">${segs}</span><span class="gauge-num"><b>${a}</b> of ${t}</span></div>`;
