function statusOf(r) {
  if (isOverdue(r)) return ['overdue', 'Overdue'];
  if (r.status === 'approved') return ['approved', r.type === 'component' ? 'Approved, awaiting pickup' : 'Accepted'];
  if (r.status === 'issued') return ['issued', 'Out on loan'];
  return [r.status, { pending: 'Pending', reviewing: 'Under review', closed: 'Closed', rejected: 'Rejected', cancelled: 'Cancelled' }[r.status] || r.status];
}
function messageFor(r) {
  const name = personName(r.requesterEmail, r.requesterName);
  const first = looksLikeId(name) ? 'there' : firstName(name);
  const lines = {
    pending: 'we’ve received your request and will get back to you soon.',
    approved: r.type === 'component' ? 'your request is approved. Please collect the parts from the EHC lab.' : 'we’ve picked up your request. Let’s find a time to meet.',
    issued: isOverdue(r) ? `the parts below were due back on ${fmtDay(r.dueDate)}. Please return them to the EHC lab as soon as you can.` : `a reminder that the parts below are due back on ${fmtDay(r.dueDate)}.`,
    closed: 'this request is now closed. Thanks!',
    rejected: 'we can’t take this request forward this time.',
    cancelled: 'this request has been cancelled.',
  };
  const items = (r.items || []).map(i => `- ${i.qty} × ${i.name}`).join('\n');
  const body = `Hi ${first},\n\nAbout your request “${r.title}”: ${lines[r.status] || ''}\n${items ? `\n${items}\n` : ''}${r.adminNote ? `\nNote: ${r.adminNote}\n` : ''}\nEHC core team`;
  const subject = `[EHC] Request #${shortId(r.id)}: ${r.title || TYPE_LABEL[r.type]}`;
  return { subject, body };
}
function mailtoHref(r) {
  const m = messageFor(r);
  return `mailto:${r.requesterEmail}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;
}

function requestCard(r, admin) {
  const [cls, label] = statusOf(r);
  const items = r.items || [];
  let due = '';
  if (r.status === 'issued' && r.dueDate) {
    due = isOverdue(r)
      ? `<span class="over">Overdue by ${plural(dayDiff(localDate(), r.dueDate), 'day')} (due ${fmtDay(r.dueDate)})</span>`
      : `<span>Return by ${fmtDay(r.dueDate)}</span>`;
  }
  const meta = [
    r.neededBy ? `<span>Needed by ${fmtDay(r.neededBy)}</span>` : '',
    due,
    r.returnedAt ? `<span>Returned ${relTime(r.returnedAt)}</span>` : '',
    admin && r.handledBy ? `<span>Last updated by ${esc(personName(r.handledBy))}</span>` : '',
  ].join('');
  const who = personName(r.requesterEmail, r.requesterName);
  const phone = personPhone(r.requesterEmail, r.requesterPhone);
  const unregistered = looksLikeId(who);
  let actions = '';
  if (admin) {
    const a = (act, text, kind = '') => `<button class="btn sm ${kind}" data-act="req-action" data-id="${esc(r.id)}" data-action="${act}">${text}</button>`;
    const label = unregistered ? '' : ' ' + esc(firstName(who));
    const mail = `<a class="btn ghost sm" href="${esc(mailtoHref(r))}">Email${label}</a>`
      + (phone ? `<a class="btn ghost sm" href="${esc(waHref(phone, messageFor(r).body))}" target="_blank" rel="noopener">WhatsApp${label}</a>` : '');
    const remark = `<button class="btn ghost sm" data-act="req-remark" data-id="${esc(r.id)}">${S.reqPriv[r.id] && S.reqPriv[r.id].remark ? 'Edit remark' : 'Add remark'}</button>`;
    const parts = r.type === 'component';
    if (OPEN_STATES.includes(r.status)) actions = (parts ? a('approve', 'Review and approve', 'primary') + a('revise', 'Edit parts') : a('approve', 'Accept', 'primary'))
      + (r.status === 'pending' ? a('review', 'Mark under review') : '') + a('reject', 'Reject', 'ghost') + mail + remark;
    else if (r.status === 'approved') actions = (parts ? a('issue', 'Hand over', 'primary') + a('revise', 'Edit allotment') + a('cancel', 'Cancel and release', 'ghost') : a('close', 'Mark resolved', 'primary') + a('cancel', 'Cancel', 'ghost')) + mail + remark;
    else if (r.status === 'issued') actions = a('return', 'Mark returned', 'primary') + mail + remark;
    else actions = mail + remark;
  } else if (r.status === 'pending') {
    actions = `<button class="btn sm" data-act="edit-own" data-id="${esc(r.id)}">Edit</button><button class="btn ghost sm" data-act="cancel-own" data-id="${esc(r.id)}">Cancel request</button>`;
  }
  const lineList = list => list.map(i => `<li><b>${Number(i.qty) || 0}×</b>${esc(i.name)}${i.kind === 'consumable' ? ' <span class="muted">(consumable)</span>' : ''}</li>`).join('');
  const changed = r.requestedItems && lineKey(r.requestedItems) !== lineKey(items);
  const priv = admin && S.reqPriv[r.id] && S.reqPriv[r.id].remark;
  return `<article class="req ${cls}">
    <header class="req-head"><span class="pill ${cls}">${label}</span><span>${TYPE_LABEL[r.type] || r.type}</span><span>#${shortId(r.id)}</span><span title="${esc(new Date(r.createdAt).toLocaleString('en-IN'))}">${relTime(r.createdAt)}</span></header>
    <h3 class="req-title">${esc(r.title || '(no title)')}</h3>
    ${admin ? `<p class="req-who"><b>${esc(unregistered ? 'Not registered yet' : who)}</b> <a href="${esc(mailtoHref(r))}">${esc(r.requesterEmail)}</a>${phone ? ` <a href="${esc(telHref(phone))}">${esc(phone)}</a>` : ''}</p>` : ''}
    ${r.message ? `<p class="req-msg">${esc(r.message)}</p>` : ''}
    ${changed ? `<p class="items-label">Asked for</p><ul class="req-items asked">${lineList(r.requestedItems)}</ul><p class="items-label">${['issued', 'closed'].includes(r.status) ? 'Given' : 'Allotted'}</p>` : ''}
    ${items.length ? `<ul class="req-items">${lineList(items)}</ul>` : ''}
    ${meta ? `<div class="req-meta">${meta}</div>` : ''}
    ${!admin && r.status === 'reviewing' ? '<div class="note quiet">The core team is reviewing this, so it can’t be edited or cancelled from here. Message them if something needs to change.</div>' : ''}
    ${priv ? `<div class="note internal"><b>Core team only:</b> ${esc(priv)}</div>` : ''}
    ${r.adminNote ? `<div class="note"><b>${admin ? 'Note to requester:' : 'From the EHC core team:'}</b> ${esc(r.adminNote)}</div>` : ''}
    ${r.lossNote ? `<div class="note warn"><b>Not returned:</b> ${esc(r.lossNote)}</div>` : ''}
    ${actions ? `<div class="req-actions">${actions}</div>` : ''}
  </article>`;
}

/* ---------- views ---------- */
function inventoryView() {
  const q = S.filters.q.trim().toLowerCase();
  const cats = ['All', ...[...new Set(S.components.map(c => c.category || 'Misc'))].sort()];
  if (!cats.includes(S.filters.cat)) S.filters.cat = 'All';
  const tag = S.filters.tag;
  const list = S.components.filter(c =>
    (S.filters.cat === 'All' || (c.category || 'Misc') === S.filters.cat) &&
    (!tag || hasTag(c, tag)) &&
    (!q || `${c.name} ${c.category} ${c.notes || ''} ${(c.tags || []).join(' ')}`.toLowerCase().includes(q)));
  const inStock = S.components.filter(c => c.availableQty > 0).length;
  const card = c => {
    const inCart = S.cart[c.id] || 0;
    const lvl = c.availableQty <= 0 ? 'zero' : '';
    let act;
    if (inCart) act = `${stepper(c.id, inCart, c.availableQty)}<span class="in-req">In your request</span>`;
    else if (c.availableQty <= 0) act = '<span class="oos">None available right now</span>';
    else act = `<button class="btn sm" data-act="cart-add" data-id="${esc(c.id)}">Add to request</button>`;
    return `<article class="part ${lvl}">
      <div class="part-top"><span>${esc(c.category || 'Misc')}</span>${kindTag(c.kind)}</div>
      <h3 class="part-name">${esc(c.name)}</h3>
      ${c.notes ? `<p class="part-notes">${esc(c.notes)}</p>` : ''}
      ${tagChips(c)}
      ${S.isAdmin && locOf(c) ? `<p class="loc">Kept at ${locLink(c)}</p>` : ''}
      ${gauge(c)}
      <div class="part-actions">${act}</div>
    </article>`;
  };
  let body;
  if (!S.components.length) body = emptyState('The inventory is empty.', S.isAdmin ? 'Add parts from the Stock tab. Bulk import takes a CSV or cells copied straight from a spreadsheet.' : 'The core team hasn’t added any parts yet.');
  else if (!list.length) body = emptyState('No parts match.', tag ? 'Clear the tag filter, or try another category.' : 'Try a shorter word, or pick another category.');
  else body = `<div class="grid">${list.map(card).join('')}</div>`;
  return `<section class="view">
    <div class="view-head"><div><h1 class="title">Inventory</h1>
      <p class="sub">${inStock} of ${plural(S.components.length, 'part type')} in stock. Add what you need, then send one request.</p></div></div>
    <div class="toolbar"><div class="search">${ICON_SEARCH}<input id="q" type="search" placeholder="Search parts or tags, e.g. ESP32, I2C, stepper" value="${esc(S.filters.q)}" data-bind="q" autocomplete="off" aria-label="Search parts"></div>
      ${tag ? `<span class="filter-on">Tagged <span class="tagchip on">${esc(tag)}</span><button class="link" data-act="tag" data-tag="">Clear</button></span>` : ''}</div>
    <div class="chips scroll">${cats.map(c => `<button class="chip ${c === S.filters.cat ? 'on' : ''}" data-act="cat" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    ${body}
  </section>`;
}

function requestView() {
  const t = S.reqType, d = S.draft;
  const hints = {
    component: 'Add parts from the inventory, then tell us what they’re for. Nothing is set aside until someone from the core team approves it.',
    help: 'Stuck on a circuit, a board that won’t respond, or a build that misbehaves? Describe it and someone from the core team will get in touch.',
    guidance: 'Want direction on a project idea, a competition, or what to learn next? Tell us where you are and what you’re aiming for.',
  };
  let cart = '';
  if (t === 'component') {
    const items = cartItems();
    if (!items.length) {
      cart = `<div class="empty-inline">No parts added yet. <button class="link" data-act="nav" data-view="inventory">Browse the inventory</button> and use “Add to request”.</div>`;
    } else {
      const units = items.reduce((a, x) => a + x.qty, 0);
      cart = `<div class="cart">${items.map(({ c, qty }) => {
        const short = qty > c.availableQty;
        return `<div class="cart-row ${short ? 'short' : ''}"><div><div class="cart-name">${esc(c.name)}</div><small>${short ? `Only ${c.availableQty} left, lower the quantity` : `${c.availableQty} available${c.kind === 'consumable' ? ', consumable (no return)' : ''}`}</small></div>${stepper(c.id, qty, c.availableQty)}<button class="x" data-act="cart-remove" data-id="${esc(c.id)}" aria-label="Remove ${esc(c.name)}">×</button></div>`;
      }).join('')}<div class="cart-foot"><span>${plural(items.length, 'part')}, ${plural(units, 'unit')}</span><button class="link" data-act="nav" data-view="inventory">Add more parts</button></div></div>`;
    }
  }
  const titleLabel = t === 'component' ? 'What are the parts for?' : 'What do you need help with?';
  const titlePh = t === 'component' ? 'e.g. Line follower for the robotics event' : t === 'help' ? 'e.g. Servo jitters when the motor starts' : 'e.g. Where to start with ROS';
  const msgLabel = t === 'component' ? 'Anything else we should know (optional)' : 'Details';
  const ed = S.editing;
  return `<section class="view narrow">
    <div class="view-head"><div><h1 class="title">${ed ? 'Edit request' : 'New request'}</h1><p class="sub">${ed ? `Changing request #${shortId(ed.id)}. You can edit it until the core team picks it up.` : 'Goes to the EHC core team. Replies and status show up under My requests.'}</p></div>
      ${ed ? '<div class="head-actions"><button class="btn ghost sm" data-act="stop-edit">Stop editing</button></div>' : ''}</div>
    ${ed ? '' : `<div class="seg" role="tablist" aria-label="Request type">${['component', 'help', 'guidance'].map(k => `<button role="tab" aria-selected="${t === k}" class="${t === k ? 'on' : ''}" data-act="req-type" data-type="${k}">${TYPE_LABEL[k]}</button>`).join('')}</div>`}
    <p class="hint">${hints[t]}</p>
    ${cart}
    <div class="field"><label for="f-title">${titleLabel}</label><input id="f-title" data-bind="draft.title" maxlength="120" value="${esc(d.title)}" placeholder="${esc(titlePh)}"></div>
    <div class="field"><label for="f-message">${msgLabel}</label><textarea id="f-message" data-bind="draft.message" rows="5" maxlength="2000" placeholder="${t === 'component' ? 'Team members, how long you need them, anything special' : 'What you’ve tried, what you expected, what happened'}">${esc(d.message)}</textarea></div>
    <div class="field short"><label for="f-needed">Needed by (optional)</label><input id="f-needed" type="date" min="${localDate()}" data-bind="draft.neededBy" value="${esc(d.neededBy)}"></div>
    <div class="form-actions"><button class="btn primary" data-act="submit-request" ${S.busy ? 'disabled' : ''}>${ed ? 'Save changes' : 'Send request'}</button></div>
  </section>`;
}

function mineView() {
  const list = S.myRequests;
  return `<section class="view narrow">
    <div class="view-head"><div><h1 class="title">My requests</h1><p class="sub">Everything you’ve asked the core team for, newest first.</p></div>
      <div class="head-actions"><button class="btn primary sm" data-act="nav" data-view="request">New request</button></div></div>
    ${list.length ? `<div class="stack">${list.map(r => requestCard(r, false)).join('')}</div>` : emptyState('No requests yet.', 'Borrow parts or ask the core team for help. It all shows up here.')}

}

const QUEUE_FILTERS = [
  ['pending', 'Pending', r => OPEN_STATES.includes(r.status)],
  ['approved', 'Awaiting pickup', r => r.status === 'approved'],
  ['issued', 'Out on loan', r => r.status === 'issued'],
  ['overdue', 'Overdue', r => isOverdue(r)],
  ['done', 'Closed', r => ['closed', 'rejected', 'cancelled'].includes(r.status)],
  ['all', 'All', () => true],
];
const QUEUE_EMPTY = { pending: 'Nothing waiting on you.', approved: 'Nobody is waiting to pick anything up.', issued: 'Nothing is out on loan.', overdue: 'Nothing is overdue.', done: 'No closed requests yet.', all: 'No requests yet.' };
function queueView() {
  const counts = Object.fromEntries(QUEUE_FILTERS.map(([k, , fn]) => [k, S.allRequests.filter(fn).length]));
  const f = QUEUE_FILTERS.find(x => x[0] === S.queueFilter) || QUEUE_FILTERS[0];
  const list = S.allRequests.filter(f[2]);
  return `<section class="view narrow">
    <div class="view-head"><div><h1 class="title">Queue</h1><p class="sub">Approving a parts request sets the stock aside immediately. It goes back on the shelf if you cancel.</p></div>
      <div class="head-actions"><button class="btn ghost sm" data-act="export" data-what="requests">Export requests</button></div></div>
    <div class="chips scroll">${QUEUE_FILTERS.map(([k, label]) => `<button class="chip ${S.queueFilter === k ? 'on' : ''} ${k === 'overdue' && counts[k] ? 'alarm' : ''}" data-act="queue-filter" data-f="${k}">${label}<span class="chip-n">${counts[k]}</span></button>`).join('')}</div>
    ${list.length ? `<div class="stack">${list.map(r => requestCard(r, true)).join('')}</div>` : emptyState(QUEUE_EMPTY[f[0]])}
  </section>`;
}

function stockView() {
  const q = S.filters.q.trim().toLowerCase();
  const list = S.components.filter(c => !q || `${c.name} ${c.category} ${(locOf(c) || {}).name || ''} ${c.notes || ''} ${(c.tags || []).join(' ')}`.toLowerCase().includes(q));
  const outUnits = S.components.reduce((a, c) => a + (c.totalQty - c.availableQty), 0);
  const stockValue = S.components.reduce((a, c) => a + (Number((S.priv[c.id] || {}).rate) || 0) * (c.totalQty || 0), 0);
  const rows = list.map(c => {
    const out = c.totalQty - c.availableQty;
    const pv = S.priv[c.id] || {};
    return `<tr>
      <td><div class="tbl-name">${esc(c.name)}</div>${c.notes ? `<small>${esc(c.notes)}</small>` : ''}${pv.remarks ? `<small class="remark">${esc(pv.remarks)}</small>` : ''}${tagChips(c, false)}</td>
      <td class="cat-cell">${esc(c.category)}</td><td data-label="At">${locLink(c, '<span class="muted">Not set</span>')}</td><td>${kindTag(c.kind)}</td>
      <td class="num ${c.availableQty <= 0 ? 'zero' : ''}" data-label="Available">${c.availableQty}</td><td class="num" data-label="Total">${c.totalQty}</td><td class="num ${out ? 'out' : ''}" data-label="Out">${out}</td><td class="num" data-label="Rate">${pv.rate != null && pv.rate !== '' ? '₹' + Number(pv.rate).toLocaleString('en-IN') : '<span class="muted">–</span>'}</td>
      <td><div class="row-actions"><button class="btn ghost sm" data-act="comp-edit" data-id="${esc(c.id)}">Edit</button><button class="btn ghost sm" data-act="comp-del" data-id="${esc(c.id)}" aria-label="Delete ${esc(c.name)}">Delete</button></div></td>
    </tr>`;
  }).join('');
  return `<section class="view">${stockSubnav()}
    <div class="view-head"><div><h1 class="title">Stock</h1><p class="sub">${plural(S.components.length, 'part type')}, ${plural(outUnits, 'unit')} out or set aside. Members see everything here except location, remarks and rate${stockValue ? `. Stock value at recorded rates: ₹${stockValue.toLocaleString('en-IN')}` : ''}.</p></div>
      <div class="head-actions"><button class="btn primary sm" data-act="comp-new">Add a part</button><button class="btn sm" data-act="bulk-import">Bulk import</button><button class="btn ghost sm" data-act="export" data-what="inventory">Export inventory</button></div></div>
    <div class="toolbar"><div class="search">${ICON_SEARCH}<input id="q2" type="search" placeholder="Filter by name, category, location or tag" value="${esc(S.filters.q)}" data-bind="q" autocomplete="off" aria-label="Filter stock"></div></div>
    ${S.components.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Part</th><th>Category</th><th>Location</th><th>Type</th><th class="num">Available</th><th class="num">Total</th><th class="num">Out</th><th class="num">Rate</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="9" class="muted">No parts match that filter.</td></tr>`}</tbody></table></div>`
      : emptyState('No parts yet.', 'Start with Bulk import: paste a CSV or copy cells from a spreadsheet. One form per part is how these projects stall.')}
  </section>`;
}

function stockSubnav() {
  const b = (v, label) => `<button class="${S.view === v ? 'on' : ''}" data-act="nav" data-view="${v}" ${S.view === v ? 'aria-current="page"' : ''}>${label}</button>`;
  return `<nav class="subnav" aria-label="Stock sections">${b('stock', 'Parts')}${b('locations', 'Locations')}</nav>`;
}

function cleanProfile(fd) {
  const name = String(fd.get('name') || '').trim().replace(/\s+/g, ' ');
  const phone = String(fd.get('phone') || '').trim();
  if (name.length < 2 || name.length > 60 || looksLikeId(name)) throw new Error('Enter your full name, the way the core team would recognise you. Not your student ID.');
  if (phone && !/^\+?[\d\s-]{7,18}$/.test(phone)) throw new Error('That phone number doesn’t look right. Use digits, spaces, + or - only.');
  return { name, phone };
}

// Re-rendering replaces the DOM; keep the caret where it was.
function withFocus(fn) {
  const a = document.activeElement;
  const id = a && a.id;
  const sel = a && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
  fn();
  if (!id) return;
  const el = document.getElementById(id);
  if (el && el !== document.activeElement) {
    el.focus({ preventScroll: true });
    if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch { /* date inputs have no caret */ }
  }
}

function openDialog({ title, body, confirm = 'Confirm', dismiss = 'Cancel', danger = false, wide = false, onConfirm, alt = null }) {
  const dlg = $('#dlg');
  dlg.className = wide ? 'wide' : '';
  dlg.innerHTML = `<form class="dlg" novalidate>
    <header><h2>${esc(title)}</h2><button type="button" class="x" data-close aria-label="Close">×</button></header>
    <div class="dlg-body">${body}</div>
    <p class="dlg-err" role="alert" hidden></p>
    <footer><button type="button" class="btn ghost" data-close>${esc(dismiss)}</button>${alt ? `<button type="button" class="btn" data-alt>${esc(alt.label)}</button>` : ''}${confirm ? `<button type="submit" class="btn ${danger ? 'danger' : 'primary'}">${esc(confirm)}</button>` : ''}</footer>
  </form>`;
  const form = dlg.querySelector('form');
  dlg.querySelectorAll('[data-close]').forEach(b => { b.onclick = () => dlg.close(); });
  const runWith = async (fn, btn) => {
    const err = form.querySelector('.dlg-err');
    form.querySelectorAll('footer .btn').forEach(b => { b.disabled = true; });
    err.hidden = true;
    try { const r = await fn(new FormData(form), form); if (r !== KEEP_OPEN) dlg.close(); }
    catch (x) { err.textContent = friendly(x); err.hidden = false; err.scrollIntoView({ block: 'nearest' }); }
    finally { form.querySelectorAll('footer .btn').forEach(b => { b.disabled = false; }); }
  };
  form.onsubmit = e => { e.preventDefault(); if (form.querySelector('[type=submit]')) runWith(onConfirm); };
  if (alt) form.querySelector('[data-alt]').onclick = () => runWith(alt.onConfirm);
  if (!dlg.open) dlg.showModal();
  const first = dlg.querySelector('.dlg-body input:not([type=hidden]), .dlg-body textarea, .dlg-body select');
  if (first) first.focus();
}

/* ---------- allotment editor: tick which parts to give, change quantities, add parts ---------- */
// lines: [{ componentId, qty, on }]. For an approved request, its own reservation counts as available.
function allotEditor(r) {
  const reserved = {};
  if (r.status === 'approved') (r.items || []).forEach(i => { reserved[i.componentId] = (reserved[i.componentId] || 0) + Number(i.qty); });
  const merged = new Map();
  (r.items || []).forEach(i => merged.set(i.componentId, (merged.get(i.componentId) || 0) + Number(i.qty)));
  const ed = { reserved, lines: [...merged].map(([componentId, qty]) => ({ componentId, qty, on: !!compById(componentId) })) };
  ed.max = id => { const c = compById(id); return c ? c.availableQty + (reserved[id] || 0) : 0; };
  ed.items = () => ed.lines.filter(l => l.on && compById(l.componentId)).map(l => ({ componentId: l.componentId, qty: Number(l.qty) }));
  ed.check = () => {
    const on = ed.lines.filter(l => l.on);
    if (!on.length) return 'Tick at least one part.';
    const bad = on.find(l => !Number.isInteger(Number(l.qty)) || Number(l.qty) < 1);
    if (bad) return `Enter a quantity of 1 or more for ${compById(bad.componentId).name}.`;
    const over = on.find(l => Number(l.qty) > ed.max(l.componentId));
    if (over) return `Only ${ed.max(over.componentId)} × ${compById(over.componentId).name} available.`;
    return '';
  };
  return ed;
}
function allotHTML(ed) {
  const rows = ed.lines.map((l, i) => {
    const c = compById(l.componentId);
    if (!c) return `<div class="al-row gone"><span class="al-name">A part that was deleted<small>Can’t be given</small></span></div>`;
    const max = ed.max(l.componentId), over = l.on && Number(l.qty) > max;
    const where = locOf(c) ? ` <span class="al-loc">${locLink(c)}</span>` : '';
    return `<div class="al-row ${l.on ? '' : 'off'} ${over ? 'over' : ''}">
      <label class="al-pick"><input type="checkbox" data-al="on" data-i="${i}" ${l.on ? 'checked' : ''}><span class="al-name">${esc(c.name)}<small>${max} available${where}</small></span></label>
      <input class="al-qty" type="number" min="1" max="${max}" step="1" value="${l.qty}" data-al="qty" data-i="${i}" aria-label="Quantity of ${esc(c.name)}" ${l.on ? '' : 'disabled'}></div>`;
  }).join('');
  const inList = new Set(ed.lines.map(l => l.componentId));
  const addable = [...S.components].sort(byName).filter(c => !inList.has(c.id) && c.availableQty > 0);
  const on = ed.lines.filter(l => l.on && compById(l.componentId));
  const units = on.reduce((a, l) => a + (Number(l.qty) || 0), 0);
  return `<div class="allot">${rows}
    ${addable.length ? `<div class="al-add"><select data-al="add" aria-label="Add a part"><option value="">+ Add a part…</option>${addable.map(c => `<option value="${esc(c.id)}">${esc(c.name)} (${c.availableQty} available)</option>`).join('')}</select></div>` : ''}
    <p class="al-sum">${on.length ? `${plural(on.length, 'part')} ticked, ${plural(units, 'unit')}${on.length < ed.lines.length ? `. ${plural(ed.lines.length - on.length, 'part')} left out` : ''}.` : 'Nothing ticked.'}</p></div>`;
}
function wireAllot(ed) {
  const box = $('#allot-box');
  const paint = () => withFocus(() => { box.innerHTML = allotHTML(ed); });
  box.onchange = e => {
    const t = e.target, i = Number(t.dataset.i);
    if (t.dataset.al === 'on') { ed.lines[i].on = t.checked; paint(); }
    if (t.dataset.al === 'add' && t.value) { ed.lines.push({ componentId: t.value, qty: 1, on: true }); paint(); }
  };
  box.oninput = e => { if (e.target.dataset.al === 'qty') { ed.lines[Number(e.target.dataset.i)].qty = e.target.value; const s = box.querySelector('.al-sum'); if (s) s.outerHTML = allotHTML(ed).match(/<p class="al-sum">[\s\S]*?<\/p>/)[0]; } };
  // Repaint after the blur finishes; replacing the input during its own blur event throws.
  box.addEventListener('focusout', e => { if (e.target.dataset.al === 'qty') setTimeout(() => { if (box.isConnected) paint(); }, 0); });
  paint();
}

function openActionDialog(id, action) {
  const r = S.allRequests.find(x => x.id === id);
  if (!r) return;
  const parts = r.type === 'component';
  const who = personName(r.requesterEmail, r.requesterName);
  const first = esc(looksLikeId(who) ? 'the requester' : firstName(who));
  let title, body, confirm, danger = false, dismissLabel = 'Cancel', alt = null, ed = null, extra = () => ({});
  const editorBox = '<div id="allot-box"></div>';
  switch (action) {
    case 'approve':
      if (parts) {
        ed = allotEditor(r);
        title = 'Review and approve';
        body = `<p>Untick anything you won’t give, change quantities, or add a part. Approving sets the ticked parts aside straight away; ${first} sees what was asked for and what was allotted.</p>${editorBox}${noteField('Note to requester (optional)', { placeholder: 'e.g. Only 2 ESP32 free this week. Pick up after 5 pm.' })}${remarkField(id)}`;
        confirm = 'Approve ticked parts';
        alt = { label: 'Save changes, decide later', action: 'revise' };
      } else {
        title = 'Accept request';
        body = `<p>Tell ${first} who’s taking this and how to reach them.</p>${noteField('Note (optional)', { placeholder: 'e.g. Meet at the lab, Thursday 6 pm' })}${remarkField(id)}`;
        confirm = 'Accept';
      }
      break;
    case 'revise':
      ed = allotEditor(r);
      title = r.status === 'approved' ? 'Edit allotment' : 'Edit parts';
      body = `<p>${r.status === 'approved' ? 'Stock moves as soon as you save: extra parts are set aside, removed ones go back on the shelf.' : `Saving marks the request as under review, so ${first} can’t change it any more. Nothing is set aside until you approve.`}</p>${editorBox}${noteField('Note to requester (optional)')}${remarkField(id)}`;
      confirm = 'Save changes';
      break;
    case 'reject':
      title = 'Reject request';
      body = noteField('Reason', { required: true, placeholder: 'e.g. We don’t stock that. The ECE lab might.' }) + remarkField(id);
      confirm = 'Reject'; danger = true;
      break;
    case 'issue': {
      ed = allotEditor(r);
      title = 'Hand over parts';
      body = `<p>Change anything that’s different from what you’re actually handing over.</p>${editorBox}
        <div class="field short"><label for="d-due">Return by</label><input id="d-due" name="due" type="date" min="${localDate()}" value="${addDays(CONFIG.defaultLoanDays)}"><small>Only used if something returnable goes out.</small></div>${noteField('Note (optional)')}${remarkField(id)}`;
      confirm = 'Hand over';
      extra = fd => ({ dueDate: fd.get('due') || '' });
      break;
    }
    case 'return': {
      const ret = (r.items || []).filter(i => i.kind !== 'consumable');
      title = 'Mark returned';
      body = `<p>Enter what actually came back. Anything missing is written off the total stock and noted on the request.</p>
        ${ret.map(i => `<label class="ret-row"><span>${esc(i.name)}</span><span class="ret-in"><input type="number" name="ret_${esc(i.componentId)}" min="0" max="${i.qty}" value="${i.qty}" inputmode="numeric" aria-label="Returned ${esc(i.name)}"><span class="muted">of ${i.qty}</span></span></label>`).join('')}
        <div style="height:14px"></div>${noteField('Note (optional)', { placeholder: 'e.g. One servo came back burnt' })}${remarkField(id)}`;
      confirm = 'Confirm return';
      extra = fd => ({ returned: Object.fromEntries(ret.map(i => [i.componentId, Number(fd.get('ret_' + i.componentId))])) });
      break;
    }
    case 'cancel':
      title = 'Cancel request';
      body = (parts && r.status === 'approved' ? '<p>The reserved parts go back on the shelf.</p>' : '') + noteField('Note (optional)') + remarkField(id);
      confirm = 'Cancel request'; danger = true; dismissLabel = 'Keep request';
      break;
    case 'close':
      title = 'Mark resolved';
      body = noteField('Note (optional)', { placeholder: 'e.g. Fixed the wiring together at the lab' }) + remarkField(id);
      confirm = 'Mark resolved';
      break;
    default: return;
  }
  const run = act => async fd => {
    const note = String(fd.get('note') || '').trim();
    if (act === 'reject' && !note) throw new Error('Add a reason. The requester sees it.');
    let x = extra(fd);
    if (ed) {
      const err = ed.check();
      if (err) throw new Error(err);
      const items = ed.items();
      // Only send a list when it differs, so plain hand-overs don't rewrite the request.
      if (act !== 'issue' || lineKey(items) !== lineKey(r.items)) x = { ...x, items };
    }
    await B.transition(id, act, { note, ...x }, S.user.email);
    await saveRemark(id, fd);
    toast(`Request #${shortId(id)} updated.`);
  };
  openDialog({ title, body, confirm, danger, dismiss: dismissLabel, wide: !!ed, onConfirm: run(action), alt: alt && { label: alt.label, onConfirm: run(alt.action) } });
  if (ed) wireAllot(ed);
}

// Popular tags first, so the same spelling gets reused.
function popularTags(limit = 16) {
  const n = new Map();
  S.components.forEach(c => (c.tags || []).forEach(t => { const k = t.toLowerCase(); const e = n.get(k) || { t, n: 0 }; e.n++; n.set(k, e); }));

}

  const name = String(newName || '').trim();
  if (!name) throw new Error('Name the new location, or pick an existing one.');
  const existing = S.locations.find(l => l.name.trim().toLowerCase() === name.toLowerCase());
  return existing ? existing.id : await B.saveLocation({ name });
}

function parseCSV(text) {
  // Cells pasted from Excel or Google Sheets arrive tab-separated; then a comma inside a cell is just text.
  const delim = text.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"' && cell === '') q = true; // quote only opens at the start of a field
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
function bulkDialog() {
  openDialog({
    title: 'Bulk import', confirm: 'Import parts', wide: true,
    body: `<p>Paste a CSV, or cells copied straight from Excel or Google Sheets. With a header row, columns are matched by name; without one, the order is <code>name</code>, <code>category</code>, <code>quantity</code>, <code>type</code>, <code>location</code>, <code>notes</code>, <code>tags</code>, <code>remarks</code>, <code>rate</code>.</p>
      <p>Only name and quantity are required. Type is <code>returnable</code> (the default) or <code>consumable</code>. Separate tags with semicolons. <b>Notes</b> are shown to everyone; <b>remarks</b> and <b>rate</b> only to the core team. Columns called <code>age</code> or <code>name_on_sheet</code> are added to the remarks. New location names are created for you.</p>
      <div class="field"><label for="d-csv">Parts</label><textarea id="d-csv" class="code" name="csv" rows="9" placeholder="name,category,quantity,type,location,notes,tags,remarks,rate&#10;Arduino Uno,Microcontrollers,15,returnable,Cabinet A,,Arduino; beginner,Clones; 2 have loose USB,170"></textarea></div>
      <label class="check-line"><input type="checkbox" name="fill" checked> For parts that already exist, fill in their remarks and rate. Quantities and everything else stay as they are.</label>`,
    onConfirm: async fd => {
      const rows = parseCSV(String(fd.get('csv') || ''));
      if (!rows.length) throw new Error('Paste at least one line.');
      // Header row → match columns by name; otherwise use the fixed order.
      const ALIAS = { name: 'name', part: 'name', item: 'name', category: 'category', quantity: 'quantity', qty: 'quantity', type: 'type', location: 'location', notes: 'notes', note: 'notes', tags: 'tags', remarks: 'remarks', remark: 'remarks', rate: 'rate', rate_inr: 'rate', price: 'rate', age: 'age', age_years: 'age', name_on_sheet: 'sheetName' };
      let cols = ['name', 'category', 'quantity', 'type', 'location', 'notes', 'tags', 'remarks', 'rate'];
      const head = rows[0].map(h => ALIAS[h.trim().toLowerCase().replace(/[\s-]+/g, '_')]);
      if (head.includes('name')) { cols = head; rows.shift(); }
      const byName = new Map(S.components.map(c => [c.name.trim().toLowerCase(), c]));
      const seen = new Set(), good = [], bad = [], dupes = [], fills = [];
      rows.forEach((r, i) => {
        const v = {};
        cols.forEach((k, j) => { if (k && v[k] === undefined) v[k] = (r[j] || '').trim(); });
        const n = Number(v.quantity);
        const remarks = [v.remarks, v.age ? `Age at the stock count: ${v.age} years` : '', v.sheetName && v.sheetName.toLowerCase() !== (v.name || '').toLowerCase() ? `Listed on the sheet as “${v.sheetName}”` : ''].filter(Boolean).join('. ');
        const rateN = Number(String(v.rate || '').replace(/[₹,\s]/g, ''));
        const priv = { remarks, rate: v.rate && Number.isFinite(rateN) ? rateN : null };
        if (!v.name) { bad.push(i + 1); return; }
        const key = v.name.toLowerCase();
        if (byName.has(key)) { dupes.push(v.name); if (remarks || priv.rate != null) fills.push({ id: byName.get(key).id, priv }); return; }
        if (seen.has(key)) { dupes.push(v.name); return; }
        if (v.quantity === '' || !Number.isInteger(n) || n < 0) { bad.push(i + 1); return; }
        seen.add(key);
        good.push({ part: { name: v.name, category: v.category, totalQty: n, kind: /^c/i.test(v.type || '') ? 'consumable' : 'returnable', location: v.location || '', notes: v.notes, tags: v.tags }, priv });
      });
      const filling = fd.get('fill') ? fills : [];
      if (!good.length && !filling.length) throw new Error(`Nothing to import. ${dupes.length ? `${plural(dupes.length, 'name')} already exist${dupes.length === 1 ? 's' : ''}. ` : ''}${bad.length ? `Lines with a missing name or a quantity that isn’t a whole number: ${bad.slice(0, 8).join(', ')}.` : ''}`);
      const locIdx = new Map(S.locations.map(l => [l.name.trim().toLowerCase(), l.id]));
      let newLocs = 0;
      for (const { part } of good) {
        const ln = part.location.trim();
        if (!ln) continue;
        if (!locIdx.has(ln.toLowerCase())) { locIdx.set(ln.toLowerCase(), await B.saveLocation({ name: ln })); newLocs++; }
        part.locationId = locIdx.get(ln.toLowerCase());
      }
      const ids = good.length ? await B.bulkAddComponents(good.map(g => g.part)) : [];
      const privOps = [
        ...good.map((g, i) => ({ id: ids[i], priv: g.priv })).filter(x => x.id && (x.priv.remarks || x.priv.rate != null)),
        ...filling,
      ].map(x => ({ op: 'set', path: `componentPrivate/${x.id}`, data: { ...x.priv, updatedAt: SERVER_TIME }, merge: true }));
      if (privOps.length) await B.batchWrite(privOps);
      toast([
        good.length ? `Imported ${plural(good.length, 'part')}.` : '',
        newLocs ? `Created ${plural(newLocs, 'location')}.` : '',
        filling.length ? `Filled remarks and rate on ${plural(filling.length, 'existing part')}.` : '',
        dupes.length - filling.length > 0 ? `Skipped ${plural(dupes.length - filling.length, 'duplicate')}.` : '',
        bad.length ? `Skipped ${plural(bad.length, 'invalid line')}.` : '',
      ].filter(Boolean).join(' '));
    },
  });
}

function toCSV(rows) {
  return rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\n');
}
function exportDialog(what) {
  let csv, file, blurb;
  if (what === 'inventory') {
    csv = toCSV([['name', 'category', 'quantity', 'type', 'location', 'notes', 'tags', 'remarks', 'rate', 'available', 'out'],
      ...S.components.map(c => { const pv = S.priv[c.id] || {}; return [c.name, c.category, c.totalQty, c.kind, (locOf(c) || {}).name || '', c.notes, (c.tags || []).join('; '), pv.remarks || '', pv.rate ?? '', c.availableQty, c.totalQty - c.availableQty]; })]);
    file = `ehc-inventory-${localDate()}.csv`;
    blurb = 'The first nine columns match Bulk import, including the core-team remarks and rate. Keep this file private, so this doubles as a backup you can paste back in.';
  } else {
    csv = toCSV([['id', 'created', 'type', 'status', 'requester', 'email', 'title', 'items', 'needed_by', 'due', 'returned', 'last_updated_by', 'note', 'not_returned'],
      ...S.allRequests.map(r => [r.id, r.createdAt, r.type, isOverdue(r) ? 'overdue' : r.status, personName(r.requesterEmail, r.requesterName), r.requesterEmail, r.title, (r.items || []).map(i => `${i.qty}x ${i.name}`).join('; '), r.neededBy, r.dueDate, r.returnedAt, r.handledBy, r.adminNote, r.lossNote])]);
    file = `ehc-requests-${localDate()}.csv`;
    blurb = 'Every request with its status, for records or a semester report.';
  }
  openDialog({
    title: what === 'inventory' ? 'Export inventory' : 'Export requests', confirm: 'Download CSV', wide: true,
    body: `<p>${blurb}</p><div class="field"><label for="d-out">CSV</label><textarea id="d-out" class="code" rows="9" readonly>${esc(csv)}</textarea></div><button type="button" class="btn ghost sm" data-copy>Copy to clipboard</button>`,
    onConfirm: async () => {
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: file });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    },
  });
  $('#dlg [data-copy]').onclick = async () => {
    try { await navigator.clipboard.writeText(csv); }
    catch { const ta = $('#d-out'); ta.select(); document.execCommand('copy'); }
    toast('Copied to clipboard.');
  };
}

/* ---------- actions ---------- */
function setCart(id, qty) {
  const c = compById(id);
  if (!c) return;
  const n = clampInt(qty, 0, Math.max(c.availableQty, 0));
  if (n <= 0) delete S.cart[id]; else S.cart[id] = n;
  render();
}
// Checks a request before it goes anywhere. lines = [{ c: component, qty }]. Returns an error message or ''.
function checkRequest(type, title, message, lines) {
  if (type === 'component') {
    if (!lines.length) return 'Add at least one part.';
    const short = lines.find(x => x.qty > x.c.availableQty);
    if (short) return `Only ${short.c.availableQty} × ${short.c.name} available right now. Lower the quantity.`;
  }
  if (!title) return type === 'component' ? 'Say what the parts are for.' : 'Add a one-line summary.';
  if (type !== 'component' && !message) return 'Add some details so the core team knows how to help.';
  return '';
}
const toItems = lines => lines.map(({ c, qty }) => ({ componentId: c.id, name: c.name, qty, kind: c.kind === 'consumable' ? 'consumable' : 'returnable' }));
async function sendNewRequest({ type, title, message, neededBy, lines }) {
  const at = nowISO();
  return B.createRequest({
    type, requesterEmail: S.user.email, requesterName: S.profile.name, requesterPhone: S.profile.phone || '',
    title, message, neededBy: neededBy || '', items: type === 'component' ? toItems(lines) : [],
    status: 'pending', createdAt: at, updatedAt: at, history: [{ status: 'pending', by: S.user.email, at }],
  });
}
async function saveRequestEdit(id, { type, title, message, neededBy, lines }) {
  const r = S.myRequests.find(x => x.id === id);
  if (!r || r.status !== 'pending') throw new Error('The core team has already picked this request up, so it can’t be changed. Ask them directly.');
  await B.updateOwnRequest(id, { title, message, neededBy: neededBy || '', items: type === 'component' ? toItems(lines) : [] });
}
// Loads a pending request into the form; whatever was in the form is set aside and restored afterwards.
function startEdit(id) {
  const r = S.myRequests.find(x => x.id === id);
  if (!r || r.status !== 'pending') { toast('Only pending requests can be edited.', 'err'); return; }
  if (!S.editing) S.stash = { cart: S.cart, draft: S.draft, reqType: S.reqType };
  S.editing = { id };
  S.reqType = r.type;
  S.cart = {};
  (r.items || []).forEach(i => { if (compById(i.componentId)) S.cart[i.componentId] = (S.cart[i.componentId] || 0) + Number(i.qty || 0); });
  S.draft = { title: r.title || '', message: r.message || '', neededBy: r.neededBy || '' };
  go('request');
}
function endEdit() {
  const st = S.stash || { cart: {}, draft: { title: '', message: '', neededBy: '' }, reqType: 'component' };
  Object.assign(S, { cart: st.cart, draft: st.draft, reqType: st.reqType, editing: null, stash: null });
}
async function submitRequest() {
  const t = S.reqType, d = S.draft;
  const fields = { type: t, title: d.title.trim(), message: d.message.trim(), neededBy: d.neededBy, lines: t === 'component' ? cartItems() : [] };
  const err = checkRequest(t, fields.title, fields.message, fields.lines);
  if (err) { toast(err, 'err'); if (/says? what|summary/i.test(err)) $('#f-title')?.focus(); return; }
  S.busy = true; render();
  try {
    if (S.editing) { await saveRequestEdit(S.editing.id, fields); endEdit(); toast('Changes saved.'); }
    else { await sendNewRequest(fields); if (t === 'component') S.cart = {}; S.draft = { title: '', message: '', neededBy: '' }; toast('Request sent. Track it under My requests.'); }
    S.busy = false;
    go('mine');
  } catch (e) {
    S.busy = false; render();
    toast(friendly(e), 'err');
  }
}

async function moveMember(id, d) {
  const m = S.site.team.find(x => x.id === id);
  if (!m) return;
  const list = S.site.team.filter(x => (x.group || 'core') === (m.group || 'core')).sort(byOrder);
  const i = list.indexOf(m), j = i + Number(d);
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  // Renumber the whole group so missing or duplicate numbers never cause a jump.
  await B.batchWrite(list.map((x, k) => ({ op: 'set', path: `team/${x.id}`, data: { order: k + 1 }, merge: true })));
}

/* =====================================================================
   Events and QR check-in
   One QR on the venue screen; everyone scans it with their own phone camera. The code in it
   changes every 30 seconds and the database only accepts the current or previous code, so a
   photo forwarded to someone outside stops working within a minute. Name and student ID come
   from the person's registration, not from anything they type.
   ===================================================================== */
const ROTATE_S = 30;
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O, 1/I/L
const newCode = () => Array.from(crypto.getRandomValues(new Uint32Array(6)), n => CODE_CHARS[n % CODE_CHARS.length]).join('');
const HOW = { qr: 'Scanned QR', code: 'Typed code', manual: 'Added by core team' };
const fmtTime = t => (t ? (() => { const [h, m] = t.split(':').map(Number); return new Date(2000, 0, 1, h, m).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }); })() : '');
const fmtStamp = iso => (iso ? new Date(iso).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '');
const evById = id => S.events.find(e => e.id === id);
function evWhen(ev) {
  const day = ev.date ? parseDay(ev.date).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) : 'Date not set';
  const time = ev.start ? `${fmtTime(ev.start)}${ev.end ? ` to ${fmtTime(ev.end)}` : ''}` : '';
  return [day, time, ev.venue].filter(Boolean).join(', ');
}
const evDateBlock = ev => {
  const d = ev.date ? parseDay(ev.date) : null;
  return `<div class="ev-date" aria-hidden="true"><b>${d ? d.getDate() : '?'}</b><span>${d ? d.toLocaleDateString('en-IN', { month: 'short' }) : ''}</span></div>`;
};
const sortEvents = list => {
  const today = localDate();
  const up = list.filter(e => (e.date || '') >= today).sort((a, b) => `${a.date}${a.start}`.localeCompare(`${b.date}${b.start}`));
  const past = list.filter(e => (e.date || '') < today).sort((a, b) => `${b.date}${b.start}`.localeCompare(`${a.date}${a.start}`));
  return { up, past };
};

async function doCheckIn(eventId, code, method) {
  code = String(code || '').trim().toUpperCase();
  const path = `events/${eventId}/attendance/${S.user.email}`;
  const existing = await B.getPath(path).catch(() => null);
  const ev = evById(eventId) || await B.getPath(`events/${eventId}`).catch(() => null);
  if (existing) return { already: true, at: existing.at, ev };
  if (!/^[A-Z0-9]{6}$/.test(code)) throw new Error('That code should be 6 letters and numbers, exactly as shown on the screen.');
  if (B.demo) { // the database rules do these checks for real; the preview imitates them
    const codes = await B.getPath(`eventCodes/${eventId}`);
    if (!ev || !ev.attendanceOpen) throw new Error('Check-in for this event is closed. Ask the core team to add you.');
    if (!codes || ![codes.current, codes.previous].includes(code)) throw new Error('That code has expired or isn’t right. Scan the screen again, or type the code showing now.');
  }
  try {
    await B.setPath(path, { name: S.profile.name, studentId: username(S.user.email), email: S.user.email, at: SERVER_TIME, method, code });
  } catch (e) {
    if (String(e.code || '').includes('permission-denied')) throw new Error(ev && ev.attendanceOpen === false ? 'Check-in for this event is closed. Ask the core team to add you.' : 'That code has expired or isn’t right. Scan the screen again, or type the code showing now.');
    throw e;
  }
  S.myAtt[eventId] = { at: nowISO() };
  return { at: nowISO(), ev };
}

}

async function startDisplay(id) {
  const ev = evById(id);
  if (!ev) return;
  stopDisplay();
  if (!ev.attendanceOpen) await B.setPath(`events/${id}`, { attendanceOpen: true, updatedAt: SERVER_TIME }, true);
  const D = S.display = { id, code: '', left: ROTATE_S, timers: [], lock: null };
  const rotate = async () => {
    const next = newCode();
    // Save first, show second: the QR on screen is always one the database will accept.
    await B.setPath(`eventCodes/${id}`, { current: next, previous: D.code || next, rotatedAt: SERVER_TIME });
    if (S.display !== D) return;
    D.code = next; D.left = ROTATE_S;
    paintDisplay(true);
  };
  const el = document.createElement('div');
  el.id = 'display'; el.className = 'display';
  document.body.appendChild(el);
  document.body.classList.add('displaying');
  paintDisplay(true);
  try { await rotate(); } catch (e) { toast(friendly(e), 'err'); }
  D.timers.push(setInterval(() => rotate().catch(e => toast(friendly(e), 'err')), ROTATE_S * 1000));
  D.timers.push(setInterval(() => { D.left = Math.max(0, D.left - 1); const bar = $('#disp-bar'); if (bar) bar.style.transform = `scaleX(${D.left / ROTATE_S})`; }, 1000));
  try { D.lock = navigator.wakeLock ? await navigator.wakeLock.request('screen') : null; } catch { /* keep-awake not supported */ }
}
function stopDisplay() {
  const D = S.display;
  if (!D) return;
  D.timers.forEach(clearInterval);
  try { D.lock && D.lock.release(); } catch { /* already released */ }
  S.display = null;
  const el = $('#display');
  if (el) el.remove();
  document.body.classList.remove('displaying');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

/* =====================================================================
   Request assistant. It turns “3 ESP32 for my line follower by Friday” into a
   draft card. The model (or the basic matcher) only proposes: nothing is saved
   until the person taps Confirm, and the database rules still apply after that.
   ===================================================================== */
const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const toks = s => norm(s).split(' ').filter(t => t.length > 1 || /\d/.test(t));
const FILLER = new Set('i im me my we our us you a an the some any of to and or please pls kindly need needs want wants wanted would like could can may get give borrow request requesting issue take send also just hi hello hey thanks add plus remove drop without'.split(' '));
const NUMW = { a: 1, an: 1, one: 1, single: 1, two: 2, couple: 2, pair: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, dozen: 12 };

// How well a phrase matches a part: 100 = exact name; otherwise the average per word
// (3 exact word, 2 prefix, 1.5 substring), with category words capped lower than name and tags.
function partScore(q, c) {
  if (norm(q) && norm(q) === norm(c.name)) return 100;
  const qt = toks(q).filter(t => !FILLER.has(t));
  if (!qt.length) return 0;
  const named = toks(`${c.name} ${(c.tags || []).join(' ')}`), cat = toks(c.category);
  let sum = 0;
  for (const t of qt) {
    const vars = [...new Set([t, t.replace(/es$/, ''), t.replace(/s$/, '')])].filter(v => v.length > 1);
    let best = 0;
    const hit = (h, v) => (h === v ? 3 : v.length >= 2 && h.startsWith(v) ? 2 : v.length >= 4 && h.includes(v) ? 1.5 : 0);
    for (const v of vars) {
      for (const h of named) best = Math.max(best, hit(h, v));
      for (const h of cat) best = Math.max(best, Math.min(1.5, hit(h, v)));
    }
    sum += best;
  }
  return sum / qt.length;
}
// One clear winner, a short list to pick from, or nothing.
function resolvePart(q) {
  const ranked = S.components.map(c => ({ c, s: partScore(q, c) })).filter(x => x.s >= 1).sort((a, b) => b.s - a.s);
  if (!ranked.length) return { options: [] };
  const [a, b] = ranked;
  if (a.s >= 100 || (a.s >= 2 && (!b || b.s <= a.s - 0.6))) return { c: a.c };
  return { options: ranked.slice(0, 4).map(x => x.c) };
}

function parseWhen(text) {
  const t = text.toLowerCase();
  if (/\b(today|tonight)\b/.test(t)) return localDate();
  if (/\btomorrow\b/.test(t)) return addDays(1);
  let m = t.match(/\bin (\d{1,2}) days?\b/);
  if (m) return addDays(Number(m[1]));
  const DAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  m = t.match(/\b(by|on|before|till|until|this|next)\s+(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(day|nesday|sday|urday|rsday)?\b/);
  if (m) {
    const target = DAYS.findIndex(d => d.startsWith(m[2].slice(0, 3)));
    let diff = (target - new Date().getDay() + 7) % 7;
    if (diff === 0 && m[1] === 'next') diff = 7;
    return addDays(diff);
  }
  const MON = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  m = t.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/) || t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?\b/);
  if (m) {
    const [day, mon] = /\d/.test(m[1]) ? [Number(m[1]), m[2]] : [Number(m[2]), m[1]];
    const now = new Date();
    let d = new Date(now.getFullYear(), MON.indexOf(mon), day);
    if (localDate(d) < localDate()) d = new Date(now.getFullYear() + 1, MON.indexOf(mon), day);
    return localDate(d);
  }
  return '';
}
// "3 ESP32 and a couple of servos for my maze bot by Friday" → [{ part, qty }]
function parseItems(text) {
  const out = [];
  for (const chunk of text.split(/,|;|\n|\band\b|&|\+|\bplus\b|\balso\b|\bwith\b/i)) {
    let words = chunk.trim().split(/\s+/).filter(Boolean);
    while (words.length && FILLER.has(norm(words[0]))) words.shift();
    if (!words.length) continue;
    let qty = null;
    const numAt = w => { const m = w.match(/^(\d{1,3})(?:x|×|pcs|nos)?$/i); return m ? Number(m[1]) : NUMW[norm(w)]; };
    if (numAt(words[0]) !== undefined && words.length > 1) { qty = numAt(words[0]); words.shift(); }
    else {
      // "can I have 3 servos": a number after words that don’t name a part starts the item.
      const k = words.findIndex((w, n) => n > 0 && n < words.length - 1 && numAt(w) !== undefined);
      if (k > 0 && !resolvePart(words.slice(0, k).join(' ')).c && !resolvePart(words.slice(0, k).join(' ')).options.length) { qty = numAt(words[k]); words = words.slice(k + 1); }
    }
    if (words.length && norm(words[0]) === 'of') words.shift();
    let rest = words.join(' ');
    const tail = rest.match(/\s*(?:x|×)\s*(\d{1,3})$|\s+(\d{1,3})\s*(?:pcs|pieces|nos|units)$/i);
    if (tail) { qty = Number(tail[1] || tail[2]); rest = rest.slice(0, tail.index); }
    if (!toks(rest).filter(t => !FILLER.has(t)).length) continue;
    const r = resolvePart(rest);
    if (r.c) out.push({ part: r.c.name, qty: qty || 1, explicit: qty !== null });
    else if (r.options.length || qty) out.push({ part: rest.trim(), qty: qty || 1, explicit: qty !== null });
  }
  return out;
}
const blankIntent = () => ({ reply: '', action: 'chat', target_request: null, request_type: 'none', title: null, message: null, needed_by: null, items: [] });
const findOwn = id => id && S.myRequests.find(r => shortId(r.id) === String(id).replace(/^#/, '').trim().toUpperCase());

// The basic matcher: no AI, used when no assistant endpoint is set or the AI is busy.
function localIntent(text) {
  const out = blankIntent();
  const low = text.toLowerCase();
  const target = S.myRequests.find(r => new RegExp(`(^|[^a-z0-9])#?${shortId(r.id)}(?![a-z0-9])`, 'i').test(text));
  const pending = S.myRequests.filter(r => r.status === 'pending');
  if (target) out.target_request = shortId(target.id);
  if (/\b(cancel|withdraw|delete|scrap)\b/.test(low)) {
    const r = target || (pending.length === 1 ? pending[0] : null);
    if (r) { out.action = 'cancel_existing'; out.target_request = shortId(r.id); }
    else out.reply = pending.length ? `Which one? Your pending requests are ${pending.map(x => '#' + shortId(x.id)).join(', ')}.` : 'You have no pending requests to cancel.';
    return out;
  }
  if (/\b(status|my requests?|any updates?|approved yet|what did i (ask|request))\b/.test(low)) { out.action = 'show_status'; return out; }
  out.needed_by = parseWhen(text) || null;
  let body = text.replace(/\b(by|on|before|till|until|this|next)\s+(today|tonight|tomorrow|sun\w*|mon\w*|tue\w*|wed\w*|thu\w*|fri\w*|sat\w*|\d{1,2}(st|nd|rd|th)?\s+[a-z]+|[a-z]{3,9}\s+\d{1,2})\b|\bin \d{1,2} days?\b|\b(today|tomorrow)\b/gi, ' ');
  const purpose = body.match(/\bfor\s+(?:my|our|the|a|an)?\s*([^,.!?\n]{3,60})/i);
  if (purpose) { out.title = purpose[1].trim().replace(/^\w/, ch => ch.toUpperCase()); body = body.replace(purpose[0], ' '); }
  const card = S.chat.card && S.chat.card.kind !== 'cancel' ? S.chat.card : null;
  const items = parseItems(body);
  if (card && card.type === 'component') {
    const cur = card.items.map(i => ({ part: i.id ? compById(i.id).name : i.raw, qty: i.qty }));
    const set = low.match(/^\s*(?:make it|change (?:it )?to|actually|no,?)\s+(\d{1,3})\b/);
    if (set && cur.length === 1) cur[0].qty = Number(set[1]);
    else if (/^\s*(remove|drop|without|no)\b/.test(low)) { const gone = parseItems(body.replace(/^\s*(remove|drop|without|no)\b/i, '')); cur.splice(0, cur.length, ...cur.filter(c => !gone.some(g => norm(g.part) === norm(c.part)))); }
    else if (items.length) {
      const adding = /^\s*(add|also|plus)\b/.test(low);
      for (const { part, qty } of items) {
        const same = cur.find(c => norm(c.part) === norm(part));
        if (same) same.qty = adding ? same.qty + qty : qty; else cur.push({ part, qty });
      }
    }
    else if (!out.title && !out.needed_by) { out.reply = 'Tell me what to change, like “make it 4” or “add a breadboard”.'; return out; }
    Object.assign(out, { action: card.kind === 'edit' ? 'edit_existing' : 'draft_new', target_request: card.kind === 'edit' ? shortId(card.targetId) : null, request_type: 'component', items: cur });
    return out;
  }
  const kind = /\b(help|stuck|not working|isn'?t working|doesn'?t work|won'?t|wont|broken|debug|error|issue|problem|burnt|fried)\b/.test(low) ? 'help'
    : /\b(guidance|advice|mentor|suggest|recommend|how (do|should|can) i|where (do|should) i start|learn|roadmap|idea)\b/.test(low) ? 'guidance' : '';
  // A part merely mentioned in a help message ("my soldering iron won’t heat") isn’t a borrow request.
  if (items.length && (!kind || items.some(i => i.explicit) || /\b(borrow|lend|issue me)\b/.test(low))) {
    const edit = target && target.status === 'pending' && /\b(change|edit|update|modify)\b/.test(low);
    Object.assign(out, { action: edit ? 'edit_existing' : 'draft_new', request_type: 'component', items: items.map(({ part, qty }) => ({ part, qty })) });
    return out;
  }
  if (kind) {
    const line = text.trim().split(/[.!?\n]/)[0].slice(0, 60);
    Object.assign(out, { action: 'draft_new', request_type: kind, title: line, message: text.trim() });
    return out;
  }
  out.reply = 'I can draft a parts request (“2 servos and an L298N for my line follower”), ask the core team for help or guidance, change or cancel a pending request, or show your requests.';
  return out;
}

// Only what the model needs: parts related to the conversation, the person’s open requests, the draft on screen.
function chatContext() {
  const ch = S.chat;
  const history = ch.msgs.filter(m => m.role === 'user' || m.role === 'assistant').slice(-8).map(m => ({ role: m.role, content: String(m.text).slice(0, 800) }));
  const recent = history.filter(m => m.role === 'user').slice(-3).map(m => m.content).join(' ');
  const words = toks(recent).filter(t => !FILLER.has(t));
  const inDraft = new Set(ch.card && ch.card.items ? ch.card.items.map(i => i.id).filter(Boolean) : []);
  let parts = S.components.filter(c => inDraft.has(c.id) || words.some(w => toks(`${c.name} ${(c.tags || []).join(' ')} ${c.category}`).some(h => h.startsWith(w.replace(/s$/, '')) || (w.length >= 3 && w.startsWith(h) && h.length >= 3))));
  if (parts.length < 3 || /\b(what|which|list|have|got|available)\b/i.test(recent)) parts = S.components;
  const catalog = parts.slice(0, 150).map(c => ({ name: c.name, available: c.availableQty }));
  const openRequests = S.myRequests.filter(r => ['pending', 'approved', 'issued'].includes(r.status)).slice(0, 10)
    .map(r => ({ id: shortId(r.id), status: statusOf(r)[1], type: r.type, title: r.title || '', neededBy: r.neededBy || '', items: (r.items || []).map(i => ({ name: i.name, qty: i.qty })) }));
  const c = ch.card;
  const draft = c && c.kind !== 'cancel' ? { kind: c.kind, target: c.targetId ? shortId(c.targetId) : null, type: c.type, title: c.title, neededBy: c.neededBy, items: c.items.map(i => ({ name: i.id ? compById(i.id).name : i.raw, qty: i.qty })) } : null;
  const now = new Date();
  return { messages: history, today: localDate(now), weekday: now.toLocaleDateString('en-IN', { weekday: 'long' }), name: (S.profile && S.profile.name) || '', catalog, openRequests, draft };
}
async function askModel() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  try {
    const res = await fetch(CONFIG.chatEndpoint, {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await B.idToken()}` },
      body: JSON.stringify(chatContext()),
    });
    if (!res.ok) { const e = new Error(`assistant ${res.status}`); e.status = res.status; throw e; }
    const data = await res.json();
    if (!data || !data.result || typeof data.result.action !== 'string') throw new Error('assistant gave an unusable answer');
    return data.result;
  } finally { clearTimeout(timer); }
}

function buildCard(res, base) {
  const prev = S.chat.card && S.chat.card.kind !== 'cancel' ? S.chat.card : null;
  const type = base ? base.type
    : ['component', 'help', 'guidance'].includes(res.request_type) ? res.request_type
    : (res.items || []).length ? 'component' : prev ? prev.type : 'component';
  let items = [];
  if (type === 'component') {
    const merged = new Map();
    for (const it of res.items || []) {
      const qty = clampInt(it.qty, 1, 99), r = resolvePart(it.part);
      const key = r.c ? r.c.id : 'raw:' + norm(it.part);
      if (merged.has(key)) merged.get(key).qty += qty;
      else merged.set(key, r.c ? { id: r.c.id, qty, raw: it.part } : { id: null, qty, raw: it.part, options: r.options.map(c => c.id) });
    }
    items = [...merged.values()];
    if (!items.length) {
      const src = base ? (base.items || []).map(i => ({ id: compById(i.componentId) ? i.componentId : null, qty: i.qty, raw: i.name, options: [] })) : prev && prev.type === 'component' ? prev.items : [];
      items = src.map(i => ({ ...i }));
    }
  }
  const pick = (v, ...fallbacks) => (typeof v === 'string' && v.trim() ? v.trim() : fallbacks.find(f => typeof f === 'string' && f) || '');
  const date = /^\d{4}-\d{2}-\d{2}$/.test(res.needed_by || '') && res.needed_by >= localDate() ? res.needed_by : '';
  return {
    kind: base ? 'edit' : 'new', targetId: base ? base.id : null, type, items, error: '',
    title: pick(res.title, base && base.title, prev && prev.title).slice(0, 120),
    message: pick(res.message, base && base.message, prev && prev.message).slice(0, 2000),
    neededBy: date || (base && base.neededBy) || (prev && prev.neededBy) || '',
  };
}
function applyIntent(res) {
  const ch = S.chat;
  let reply = String(res.reply || '').trim();
  const say = (text, extra = {}) => ch.msgs.push({ role: 'assistant', text, ...extra });
  const pendingOnly = r => `#${shortId(r.id)} is ${statusOf(r)[1].toLowerCase()}, so it can’t be changed from here. Ask the core team directly.`;
  switch (res.action) {
    case 'draft_new':
    case 'edit_existing': {
      let base = null;
      if (res.action === 'edit_existing') {
        base = findOwn(res.target_request) || (ch.card && ch.card.kind === 'edit' ? S.myRequests.find(r => r.id === ch.card.targetId) : null);
        if (!base) { say(reply || 'Which request? Give me its number, like #' + (S.myRequests[0] ? shortId(S.myRequests[0].id) : 'AB12C') + '.'); return; }
        if (base.status !== 'pending') { ch.card = null; say(pendingOnly(base)); return; }
      }
      ch.card = buildCard(res, base);
      const c = ch.card;
      const unsure = c.items.filter(i => !i.id).length;
      say(reply || (unsure ? 'Here’s a draft. Pick the right part where I wasn’t sure, then confirm.' : !c.title ? 'Here’s a draft. What’s it for? Add that, then confirm.' : 'Here’s the draft. Check it and confirm; nothing is sent until you do.'));
      return;
    }
    case 'cancel_existing': {
      const r = findOwn(res.target_request);
      if (!r) { say(reply || 'Which request should I cancel? Give me its number.'); return; }
      if (r.status !== 'pending') { say(pendingOnly(r)); return; }
      ch.card = { kind: 'cancel', targetId: r.id };
      say(reply || `Cancel #${shortId(r.id)}, “${r.title}”? Confirm below.`);
      return;
    }
    case 'show_status':
      say(reply || 'Here’s where your requests stand:', { status: true });
      return;
    default:
      say(reply || 'I can draft a parts request, ask the core team for help or guidance, change or cancel a pending request, or show your requests.');
  }
}
async function chatSend(text) {
  const ch = S.chat;
  text = String(text || '').trim().slice(0, 500);
  if (!text || ch.busy) return;
  ch.msgs.push({ role: 'user', text });
  ch.busy = true; renderChat(true);
  let res;
  if (ch.mode === 'ai') {
    try { res = await askModel(); }
    catch (e) {
      res = localIntent(text);
      ch.msgs.push({ role: 'note', text: e.status === 429 ? 'The AI assistant is at its limit for now, so I used basic matching. Double-check the draft.' : e.status === 401 ? 'Your sign-in needs refreshing. Reload the page; I used basic matching meanwhile.' : 'Couldn’t reach the AI assistant, so I used basic matching. Double-check the draft.' });
    }
  } else res = localIntent(text);
  ch.busy = false;
  applyIntent(res);
  renderChat(true);
}
async function confirmCard() {
  const ch = S.chat, card = ch.card;
  if (!card || ch.busy) return;
  const say = text => ch.msgs.push({ role: 'assistant', text });
  if (card.kind === 'cancel') {
    ch.busy = true; renderChat();
    try { await B.cancelOwnRequest(card.targetId); ch.card = null; say(`Cancelled #${shortId(card.targetId)}.`); }
    catch (e) { say(friendly(e)); }
    ch.busy = false; renderChat(true); return;
  }
  if (card.items.some(i => !i.id)) { card.error = 'Pick the right part, or remove the ones marked in red, first.'; renderChat(); return; }
  const lines = card.items.map(i => ({ c: compById(i.id), qty: i.qty })).filter(x => x.c);
  const fields = { type: card.type, title: card.title.trim(), message: card.message.trim(), neededBy: card.neededBy, lines };
  const err = checkRequest(card.type, fields.title, fields.message, lines);
  if (err) { card.error = err; renderChat(); if (/for\?|summary/i.test(err)) $('#chat-title')?.focus(); return; }
  ch.busy = true; card.error = ''; renderChat();
  try {
    if (card.kind === 'edit') { await saveRequestEdit(card.targetId, fields); say(`Saved. #${shortId(card.targetId)} is updated and still pending.`); }
    else { const id = await sendNewRequest(fields); say(`Sent${id ? ` as #${shortId(id)}` : ''}. You’ll see updates under My requests.`); }
    ch.card = null;
  } catch (e) { card.error = friendly(e); }
  ch.busy = false; renderChat(true);
}
// Hands the draft to the full form for anything the card can’t do (add from the catalogue, long notes).
function cardToForm() {
  const card = S.chat.card;
  if (!card || card.kind === 'cancel') return;
  if (card.kind === 'edit') { startEdit(card.targetId); }
  else if (S.editing) endEdit();
  S.reqType = card.type;
  S.cart = {};
  card.items.filter(i => i.id).forEach(i => { S.cart[i.id] = (S.cart[i.id] || 0) + i.qty; });
  S.draft = { title: card.title, message: card.message, neededBy: card.neededBy };
  S.chat.card = null;
  S.chat.msgs.push({ role: 'assistant', text: 'Moved the draft into the request form.' });
  go('request');
}

    ${card.error ? `<p class="ccard-err" role="alert">${esc(card.error)}</p>` : ''}
    <div class="ccard-actions"><button class="btn primary sm" data-act="chat-confirm" ${S.chat.busy ? 'disabled' : ''}>${card.kind === 'edit' ? 'Save changes' : 'Confirm and send'}</button><button class="btn ghost sm" data-act="chat-form">Open in form</button><button class="btn ghost sm" data-act="chat-discard">Discard</button></div>

function statusListHTML() {

let chatSeen = 0;
function renderChat(scroll = false) {
  const el = $('#chat');
  if (!el) return;
  const ch = S.chat;
  el.hidden = !ch.open;
  $('#chat-fab').hidden = ch.open;
  document.body.classList.toggle('chat-open', ch.open);
  if (!ch.open) return;
  $('#chat-mode').textContent = ch.mode === 'ai' ? 'AI drafts, you confirm' : 'Basic matching, you confirm';
  if (!ch.msgs.length) {
    const first = firstName((S.profile && S.profile.name) || '');
    ch.msgs.push({ role: 'assistant', text: `Hi ${first}. Tell me what you need, like “3 ESP32 and a breadboard for my line follower by Friday”. I’ll draft it, and nothing is sent until you confirm.` });
  }
  const msgs = ch.msgs.map(m => `<div class="msg ${m.role}">${esc(m.text)}${m.status ? statusListHTML() : ''}</div>`).join('');
  const sugg = ch.msgs.length <= 1 && !ch.card ? `<div class="suggest">${['2 servos and an L298N for my line follower', 'Show my requests', 'My ESP32 won’t upload, can someone help?'].map(t => `<button type="button" data-act="chat-suggest" data-text="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : '';
  const log = $('#chat-log');
  withFocus(() => { log.innerHTML = msgs + (ch.card ? chatCardHTML(ch.card) : '') + (ch.busy ? '<p class="typing">Thinking…</p>' : '') + sugg; });
  if (scroll || ch.msgs.length !== chatSeen) { log.scrollTop = log.scrollHeight; chatSeen = ch.msgs.length; }
}

    openDialog({
      title: 'Remove admin', confirm: 'Remove admin', danger: true,
      body: `<p><b>${esc(email)}</b> will lose access to the queue, stock and admin list. Their own requests stay.</p>`,
      onConfirm: async () => { await B.removeAdmin(email); toast(`${email} is no longer an admin.`); },
    });
  },
};
const FORMS = {
  'site-settings': async f => {
    const fd = new FormData(f), v = k => String(fd.get(k) || '').trim();
    const links = ['instagram', 'linkedin', 'github'].map(v);
    if (!links.every(urlOk)) { toast('Links must start with https://', 'err'); return; }
    try {
      await B.setPath('site/settings', { tagline: v('tagline'), about: v('about'), email: v('email'), instagram: links[0], linkedin: links[1], github: links[2], updatedAt: SERVER_TIME }, true);
      toast('Saved. The website shows it right away.');
    } catch (e) { toast(friendly(e), 'err'); }
  },
  'checkin-code': async f => {
    const btn = f.querySelector('[type=submit]');
    btn.disabled = true;
    try { checkinResult(await doCheckIn(f.dataset.id, f.code.value, 'code')); render(); }
    catch (e) { toast(friendly(e), 'err'); }
    finally { btn.disabled = false; }
  },
  chat: f => { const ta = f.querySelector('textarea'); const t = ta.value; ta.value = ''; ta.style.height = ''; chatSend(t); },
  'profile-setup': async f => {
    const err = $('#setup-err'), btn = f.querySelector('[type=submit]');
    err.hidden = true;
    try {
      const p = cleanProfile(new FormData(f));
      btn.disabled = true;
      await B.saveProfile(S.user.email, p);
      S.profile = p; S.needsProfile = false;
      render();
      runPendingCheckin();
      toast(`Thanks, ${firstName(p.name)}. You’re all set.`);
    } catch (e) { err.textContent = friendly(e); err.hidden = false; btn.disabled = false; }
  },
  'add-admin': async f => {
    const email = f.email.value.trim().toLowerCase();
    if (!emailOk(email) || !emailAllowed(email)) { toast(`Admins need a ${domainsText()} address.`, 'err'); return; }
    if (S.admins.some(a => a.email === email)) { toast(`${email} is already an admin.`, 'err'); return; }
    try { await B.addAdmin(email, S.user.email); f.reset(); toast(`${email} is now an admin.`); }
    catch (e) { toast(friendly(e), 'err'); }
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.tagName === 'A') e.preventDefault();
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  const b = e.target.dataset && e.target.dataset.bind;
  if (!b) return;
  if (b === 'q') { S.filters.q = e.target.value; render(); }
  else if (b.startsWith('draft.')) S.draft[b.slice(6)] = e.target.value;
  else if (b.startsWith('chat.') && S.chat.card) S.chat.card[b.slice(5)] = e.target.value;
});
// Enter sends, Shift+Enter makes a new line; the box grows with the text. Escape closes the panel.
document.addEventListener('keydown', e => {
  if (e.target.id === 'chat-in' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); e.target.form.requestSubmit(); }
  if (e.key === 'Escape' && S.display && !document.fullscreenElement && !$('#dlg').open) { stopDisplay(); return; }
  if (e.key === 'Escape' && S.chat.open && !$('#dlg').open && !$('#lightbox').open) { S.chat.open = false; render(); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.ev.clickable')) openEvent(e.target.dataset.id);
});
document.addEventListener('input', e => { if (e.target.id === 'chat-in') { e.target.style.height = ''; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; } });
document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('input[data-gallery-add]')) { const files = [...e.target.files]; e.target.value = ''; uploadGallery(files); return; }
  const inp = e.target.closest && e.target.closest('input[data-photo-for]');
  if (inp && inp.files && inp.files[0]) { uploadLocationPhoto(inp.dataset.photoFor, inp.files[0]); inp.value = ''; }
});
$('#lightbox').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form](f);
});

/* ---------- auth + data wiring ---------- */
async function handleAuth(u) {
  unsubs.forEach(f => f()); unsubs = [];
  S.authReady = true;
  stopDisplay(); closeEventView();
  S.site = { settings: null, admin: null, team: [], projects: [], gallery: [] };
  Object.assign(S, { user: null, isAdmin: false, profile: null, needsProfile: false, components: [], myRequests: [], allRequests: [], admins: [], users: {}, locations: [], priv: {}, reqPriv: {}, events: [], myAtt: {} });
  if (!u) { render(); return; }
  if (!emailAllowed(u.email) || u.verified === false) {
    S.authError = `${u.email} isn’t a ${domainsText()} account. Sign in with your college Google account.`;
    await B.signOut();
    return;
  }
  S.authError = '';
  S.user = u;
  const [admin, profile] = await Promise.all([B.checkAdmin(u.email), B.getProfile(u.email).catch(() => null)]);
  S.isAdmin = admin;
  S.profile = profile;
  S.needsProfile = !(profile && profile.name);
  S.view = S.isAdmin ? 'queue' : 'inventory';
  unsubs.push(B.watchComponents(list => {
    S.components = list.sort(byName);
    for (const id of Object.keys(S.cart)) if (!compById(id)) delete S.cart[id];
    render();
  }));
  unsubs.push(B.watchMyRequests(u.email, list => { S.myRequests = list.sort(byNewest); render(); }));
  if (S.isAdmin) {
    unsubs.push(B.watchAllRequests(list => { S.allRequests = list.sort(byNewest); render(); }));
    unsubs.push(B.watchAdmins(list => { S.admins = list; render(); }));
    unsubs.push(B.watchUsers(map => { S.users = map; render(); }));
    unsubs.push(B.watchLocations(list => { S.locations = list; render(); }));
    unsubs.push(B.watchPath('componentPrivate', list => { S.priv = Object.fromEntries(list.map(d => [d.id, d])); render(); }));
    unsubs.push(B.watchPath('requestPrivate', list => { S.reqPriv = Object.fromEntries(list.map(d => [d.id, d])); render(); }));
    unsubs.push(B.watchPath('site', list => { S.site.settings = list.find(d => d.id === 'settings') || {}; S.site.admin = list.find(d => d.id === 'admin') || {}; render(); }));
    for (const col of ['team', 'projects', 'gallery']) unsubs.push(B.watchPath(col, list => { S.site[col] = list; render(); }));
  }
  // Members only see events marked for the website; the core team sees drafts too.
  unsubs.push(B.watchPath('events', list => { S.events = list; render(); paintDisplay(); if (!S.isAdmin) loadMyAttendance(); }, S.isAdmin ? null : ['published', '==', true]));
  if (S.pendingCheckin) S.view = 'events';
  render();
  runPendingCheckin();
}

(async function boot() {
  const ci = new URLSearchParams(location.search).get('checkin');
  if (ci && /^[\w-]+\.[A-Za-z0-9]{6}$/.test(ci)) {
    const [eventId, code] = ci.split('.');
    S.pendingCheckin = { eventId, code };
    history.replaceState(null, '', location.pathname + location.hash); // a refresh shouldn't re-submit it
  }
  render();
  try { B = DEMO ? makeDemoBackend() : await makeFirebaseBackend(); }
  catch (e) {
    $('#app').innerHTML = `<div class="splash"><p class="alert">Couldn’t load Firebase: ${esc(friendly(e))}</p></div>`;
    return;
  }
  B.onAuth(handleAuth);
})();
</script>
